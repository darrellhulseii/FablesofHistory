function shade(c,amt){
  var n=parseInt(c.slice(1),16), r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r+amt))); g=Math.max(0,Math.min(255,Math.round(g+amt)));
  b=Math.max(0,Math.min(255,Math.round(b+amt)));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function actorSprite(cf){

    for(var f=0;f<3;f++){ out[d][f]=mk(16,24,function(x){ drawActor(x,cf,d,f); }); } }

}
function drawActor(x,cf,d,f){
  var skin=cf.skin||'#d8a878', hair=cf.hair||'#3a2a1a', coat=cf.coat||'#4a4a56',
      acc=cf.acc||null, hat=cf.hat||null;
  var lit=shade(coat,26), drk=shade(coat,-30), dk2=shade(coat,-56);
  var skD=shade(skin,-34), hrL=shade(hair,22), hrD=shade(hair,-24);
  var OL='#14121a';

  var la=0, lb=0;
  if(f===1){ la=-1; lb=1; } else if(f===2){ la=1; lb=-1; }
  var bob=(f===0)?0:-1;
  /* --- legs --- */
  px(x,4,19,3,5,dk2); px(x,9,19,3,5,dk2);
  px(x,4,19+ (la>0?1:0),3,5-(la>0?1:0),drk);
  px(x,9,19+ (lb>0?1:0),3,5-(lb>0?1:0),drk);
  px(x,4,23,3,1,OL); px(x,9,23,3,1,OL);
  px(x,3,22,4,2,'#1c1a20'); px(x,9,22,4,2,'#1c1a20');
  /* --- torso --- */
  var ty=11+bob;
  px(x,3,ty,10,9,coat);
  px(x,3,ty,10,1,lit);
  px(x,3,ty,2,9,(d===2)?drk:lit);
  px(x,11,ty,2,9,(d===1)?lit:drk);
  px(x,3,ty+8,10,1,dk2);
  if(d===0){ px(x,7,ty+1,2,7,drk); px(x,6,ty+1,1,7,dk2); }
  if(d===3){ px(x,3,ty,10,9,drk); px(x,3,ty,10,1,coat); px(x,7,ty+1,2,7,dk2); }
  if(acc){ px(x,3,ty+2,10,2,acc); px(x,3,ty+2,10,1,shade(acc,30)); }
  /* outline torso */
  px(x,2,ty,1,9,OL); px(x,13,ty,1,9,OL); px(x,3,ty-1,10,1,OL);
  /* --- arms --- */
  var ay=ty+1;
  if(d===0||d===3){
    px(x,1,ay+(la>0?1:0),2,6,drk); px(x,13,ay+(lb>0?1:0),2,6,drk);

  var hy=2+bob;

  px(x,3,hy+1,1,7,OL); px(x,12,hy+1,1,7,OL); px(x,4,hy-1,8,1,OL); px(x,4,hy+9,8,1,shade(skin,-60));
  if(d===0){
    px(x,4,hy,8,3,hair); px(x,4,hy,8,1,hrL);
    px(x,3,hy+1,1,4,hair); px(x,12,hy+1,1,4,hair);
    px(x,5,hy+3,6,1,shade(skin,-26));
    px(x,4,hy+5,1,3,skD);  px(x,11,hy+5,1,3,skD);
    px(x,5,hy+4,2,2,'#1a1218'); px(x,9,hy+4,2,2,'#1a1218');
    px(x,5,hy+4,1,1,'#f0f0f8'); px(x,10,hy+4,1,1,'#f0f0f8');
    px(x,7,hy+6,2,1,shade(skin,-40));
    px(x,6,hy+7,4,1,'#8a5348');
  } else if(d===3){
    px(x,4,hy,8,8,hair); px(x,4,hy,8,1,hrL); px(x,4,hy+7,8,1,hrD);
    px(x,3,hy+1,1,6,hair); px(x,12,hy+1,1,6,hair);
    px(x,6,hy+2,4,3,hrD); px(x,7,hy+2,2,3,hair);
  } else {
    var fw=(d===1)?0:1;
    px(x,4,hy,8,3,hair); px(x,4,hy,8,1,hrL);
    px(x,fw?4:10,hy+1,2,6,hair);
    var ex=(d===1)?5:9;
    px(x,ex,hy+4,2,2,'#1a1218'); px(x,ex,hy+4,1,1,'#f0f0f8');
    px(x,d===1?4:10,hy+3,2,5,skD);
  }
  if(cf.asc){
    var ac=cf.ascCol||'#cdefff', ac2=cf.ascCol2||'#a6e0ff';
    px(x,4,hy-1,8,1,ac); px(x,3,hy,1,3,ac2); px(x,12,hy,1,3,ac2);

    px(x,1,hy,1,2,OL); px(x,14,hy,1,2,OL);
    if(cf.star&&d!==3){ px(x,7,hy-3,2,4,'#f0d040'); px(x,6,hy-2,4,2,'#f0d040');
      px(x,7,hy-2,2,1,'#fff4a0'); }
  }
  if(cf.cape&&d!==0){
    var cp=cf.cape;
    px(x,d===3?3:(d===1?11:3),ty,2,10,cp); px(x,d===3?3:(d===1?11:3),ty,2,1,shade(cp,30));

UND1:{t:"I am a sick man... I am a spiteful man. I am an unattractive man. I believe my liver is diseased.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND2:{t:"Twice two makes four is not life, gentlemen, it is the beginning of death.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},

UND4:{t:"What man wants is simply independent choice, whatever that independence may cost and wherever it may lead.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND5:{t:"The best definition of man is: a being that goes on two legs and is ungrateful.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND6:{t:"I could not become anything: neither spiteful nor kind, neither a rascal nor an honest man, neither a hero nor an insect.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND7:{t:"Man is a frivolous and incongruous creature, and perhaps, like a chess-player, loves the process of the game, not the end of it.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND8:{t:"I swear, gentlemen, that to be too conscious is an illness - a real thorough-going illness.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND9:{t:"I won't consult a doctor from spite.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND10:{t:"Twice two makes four seems to me simply a piece of insolence.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND11:{t:"The whole work of man really seems to consist in nothing but proving to himself every minute that he is a man and not a piano-key.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND12:{t:"In despair there are the most intense enjoyments.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND13:{t:"The long and short of it is, gentlemen, that it is better to do nothing! Better conscious inertia!",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND14:{t:"I have only in my life carried to an extreme what you have not dared to carry halfway.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND15:{t:"Leave us alone without books and we shall be lost and in confusion at once.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND16:{t:"We are oppressed at being men - men with a real individual body and blood.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND17:{t:"We are stillborn, and for generations past have been begotten, not by living fathers.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND18:{t:"We are all cripples, every one of us, more or less.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND19:{t:"They won't let me... I can't be good!",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND20:{t:"Love really consists in the right, freely given by the beloved object, to tyrannise over her.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND21:{t:"Man is fond of counting his troubles, but he does not count his joys.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND22:{t:"I am alone and they are all.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},
UND23:{t:"Civilisation only develops in man a capacity for feeling a greater variety of sensations.",a:"Dostoevsky",w:"Notes from the Underground",tr:"tr. Garnett, 1918"},

/* ================= OVERWORLD GENERATION ================= */
var OW_W=76,OW_H=56;
/* [x, y, map id] — doors and every return warp are derived from these, so the
   world can be resized without hand-editing a single coordinate */
var OW_CITIES=[[9,40,'VET'],[57,42,'KHO'],[59,11,'ZAR'],[31,5,'CAP']];
var OW_HUTS=[[17,31,'TALE1'],[16,13,'TALE2'],[60,27,'TALE3'],[64,47,'TALE4'],
             [7,21,'TALE5'],[36,41,'TALE6'],[45,19,'TALE7'],[47,50,'TALE8'],
             [26,24,'CAMP1'],[50,34,'CAMP2'],[12,48,'CAMP3'],[68,20,'CAMP4']];
function buildOverworld(){
  var g=[],y,x,i;
  for(y=0;y<OW_H;y++){ g[y]=[]; for(x=0;x<OW_W;x++) g[y][x]='.'; }
  seed(20260907);
  for(y=0;y<OW_H;y++)for(x=0;x<OW_W;x++){
    var edge=Math.min(x,y,OW_W-1-x,OW_H-1-y);
    if(edge<2) g[y][x]='^';
    else if(edge<4 && rnd()<0.5) g[y][x]='^';
    else if(y<9 && rnd()<0.42) g[y][x]='_';
    else if(rnd()<0.15){ var q=rnd(); g[y][x]=(y<10?'N':(q<0.42?'T':q<0.72?'N':q<0.89?'v':'o')); }
    else if(rnd()<0.045) g[y][x]='^';
    else if(rnd()<0.03) g[y][x]='F';
  }
  /* a northern range and a southern steppe give the map some regions */
  for(y=6;y<12;y++) for(x=6;x<OW_W-6;x++) if(rnd()<0.34-Math.abs(y-9)*0.06) g[y][x]='^';
  for(y=OW_H-14;y<OW_H-4;y++) for(x=OW_W-26;x<OW_W-4;x++){
    if(g[y][x]==='T'||g[y][x]==='N'){ if(rnd()<0.7) g[y][x]=(rnd()<0.5?'.':'v'); } }
  /* two rivers */
  function river(sx,sy,ey,drift){
    var rx=sx;
    for(var yy=sy;yy<ey;yy++){ rx+=(rnd()<0.5?-1:1)*drift; 
      if(rx<5)rx=5; if(rx>OW_W-7)rx=OW_W-7;
      for(var xx=rx;xx<rx+2;xx++) g[yy][xx]='~';
      if(g[yy][rx-1]!=='~') g[yy][rx-1]=(yy<9?'_':'.');
      if(g[yy][rx+2]!=='~') g[yy][rx+2]=(yy<9?'_':'.'); }
  }
  river(40,4,OW_H-3,1); river(20,26,OW_H-3,1);
  /* a lake */
  var lx=48,ly=24;
  for(y=ly-5;y<ly+6;y++) for(x=lx-8;x<lx+9;x++){
    var d2=(x-lx)*(x-lx)/2.4+(y-ly)*(y-ly);
    if(d2<26 && y>2 && y<OW_H-3 && x>2 && x<OW_W-3) g[y][x]='~'; }
  /* farm belt around Vetrograd */
  for(y=44;y<50;y++) for(x=6;x<22;x++) if(y<OW_H-3&&rnd()<0.5) g[y][x]=(rnd()<0.7?'A':'J');

  function stamp(cx,cy){
    var yy,xx;
    for(yy=0;yy<4;yy++) for(xx=0;xx<6;xx++) g[cy+yy][cx+xx]=(yy===0)?'r':'b';
    g[cy+3][cx+2]='D'; g[cy+3][cx+3]='D';
    for(xx=-1;xx<7;xx++) if(cy+4<OW_H&&cx+xx>=0&&cx+xx<OW_W) g[cy+4][cx+xx]=',';
  }
  function hut(cx,cy){
    var yy,xx;
    for(yy=-1;yy<5;yy++) for(xx=-2;xx<6;xx++){
      var gy=cy+yy,gx=cx+xx;
      if(gy>2&&gy<OW_H-3&&gx>2&&gx<OW_W-3&&g[gy][gx]!=='D') g[gy][gx]=(gy<9?'_':'.'); }
    for(xx=0;xx<4;xx++) g[cy][cx+xx]='r';
    for(yy=1;yy<3;yy++) for(xx=0;xx<4;xx++) g[cy+yy][cx+xx]='b';
    g[cy+2][cx+1]='D'; g[cy+2][cx+2]='D';
    for(xx=-1;xx<5;xx++) g[cy+3][cx+xx]=',';
    g[cy+3][cx-2]='N'; g[cy+3][cx+5]='N'; g[cy-1][cx-1]='N'; g[cy-1][cx+4]='N';
  }
  function road(ax,ay,bx,by){
    var cx=ax,cy=ay,guard=0;
    while((cx!==bx||cy!==by)&&guard++<700){
      if(cx!==bx) cx+=(bx>cx?1:-1); else if(cy!==by) cy+=(by>cy?1:-1);
      if(cy<0||cy>=OW_H||cx<0||cx>=OW_W) break;
      var t=g[cy][cx];
      if(t==='~'){ g[cy][cx]='='; } else if(t!=='D'&&t!=='r'&&t!=='b') g[cy][cx]=',';
    }
  }
  for(i=0;i<OW_CITIES.length;i++) stamp(OW_CITIES[i][0],OW_CITIES[i][1]);
  for(i=0;i<OW_HUTS.length;i++) hut(OW_HUTS[i][0],OW_HUTS[i][1]);
  for(i=0;i<OW_CITIES.length;i++){ var c=OW_CITIES[i];
    for(var k=-1;k<7;k++){ var yy2=c[1]+4, xx2=c[0]+k;
      if(yy2<OW_H&&xx2>=0&&xx2<OW_W&&g[yy2][xx2]!=='D') g[yy2][xx2]=','; } }
  for(i=0;i<OW_HUTS.length;i++){ var h=OW_HUTS[i];
    for(var k2=-1;k2<5;k2++){ var yy3=h[1]+3, xx3=h[0]+k2;
      if(yy3<OW_H&&xx3>=0&&xx3<OW_W&&g[yy3][xx3]!=='D') g[yy3][xx3]=','; } }
  /* trunk roads between the four cities */
  road(11,44,59,44); road(59,44,61,15); road(61,15,34,15); road(34,15,34,9);
  road(11,44,11,34); road(11,34,34,34); road(34,34,34,20);
  /* spurs out to every outlying door */
  var HOME=[OW_CITIES[0][0]+2,OW_CITIES[0][1]+4];
  function doorOf(a,city){ return city?[a[0]+2,a[1]+4]:[a[0]+1,a[1]+3]; }
  for(i=0;i<OW_HUTS.length;i++){ var d0=doorOf(OW_HUTS[i],0);
    road(d0[0],d0[1],HOME[0],HOME[1]); }
  /* guarantee reachability whatever the terrain rolled */
  function reach(sx,sy){
    var seen={},q=[[sx,sy]]; seen[sx+','+sy]=1;
    var nb=[[0,1],[0,-1],[1,0],[-1,0]];
    while(q.length){ var p=q.shift();
      for(var d=0;d<4;d++){ var nx=p[0]+nb[d][0], ny=p[1]+nb[d][1], kk=nx+','+ny;
        if(seen[kk])continue;
        if(nx<0||ny<0||nx>=OW_W||ny>=OW_H)continue;
        if(SOLID[g[ny][nx]])continue;
        seen[kk]=1; q.push([nx,ny]); } }
    return seen;
  }
  var doors=[];
  for(i=0;i<OW_CITIES.length;i++) doors.push(doorOf(OW_CITIES[i],1));
  for(i=0;i<OW_HUTS.length;i++) doors.push(doorOf(OW_HUTS[i],0));
  for(var pass=0;pass<4;pass++){
    var seen=reach(HOME[0],HOME[1]), missing=0;
    for(i=0;i<doors.length;i++)
      if(!seen[doors[i][0]+','+doors[i][1]]){ missing++; road(doors[i][0],doors[i][1],HOME[0],HOME[1]); }
    if(!missing) break;
  }
  var rows=[]; for(y=0;y<OW_H;y++) rows.push(g[y].join(''));
  return {rows:rows,cities:OW_CITIES,huts:OW_HUTS};
}

/* ================= THE GREEN WORLD ================= */
var ZW=56,ZH=42;
var Z_SITES=[[10,26,'ZVIL'],[40,10,'ZTEMPLE'],[43,31,'ZSPRING'],
             [20,14,'ARENA1'],[32,21,'ARENA2'],[47,20,'ARENA3'],
             [25,33,'ARENA4'],[14,7,'ARENA5']];
function buildZelyon(){
  var g=[],y,x,i;
  for(y=0;y<ZH;y++){ g[y]=[]; for(x=0;x<ZW;x++) g[y][x]='z'; }
  seed(770311);
  for(y=0;y<ZH;y++)for(x=0;x<ZW;x++){
    var edge=Math.min(x,y,ZW-1-x,ZH-1-y);
    if(edge<2) g[y][x]='U';
    else if(edge<3 && rnd()<0.5) g[y][x]='U';
    else if(rnd()<0.16){ var q=rnd(); g[y][x]=(q<0.55?'Y':q<0.8?'U':'v'); }
    else if(rnd()<0.05) g[y][x]='F';
  }
  /* green seas and pools */
  for(y=4;y<ZH-4;y++){ var rx=6+((Math.sin(y*0.4)*3)|0);
    for(x=rx;x<rx+2;x++) if(x>2&&x<ZW-3) g[y][x]='u'; }
  var lx=30,ly=26;
  for(y=ly-4;y<ly+5;y++) for(x=lx-6;x<lx+7;x++){
    var d2=(x-lx)*(x-lx)/2.2+(y-ly)*(y-ly);
    if(d2<18&&y>2&&y<ZH-3&&x>2&&x<ZW-3) g[y][x]='u'; }
  function dome(cx,cy){
    var yy,xx;
    for(yy=-1;yy<4;yy++) for(xx=-2;xx<6;xx++){
      var gy=cy+yy,gx=cx+xx;
      if(gy>2&&gy<ZH-3&&gx>2&&gx<ZW-3) g[gy][gx]='z'; }
    for(xx=0;xx<4;xx++) g[cy][cx+xx]='Q';
    for(yy=1;yy<3;yy++) for(xx=0;xx<4;xx++) g[cy+yy][cx+xx]='b';
    g[cy+2][cx+1]='D'; g[cy+2][cx+2]='D';
    for(xx=-1;xx<5;xx++) g[cy+3][cx+xx]=',';
  }
  function road(ax,ay,bx,by){
    var cx=ax,cy=ay,guard=0;
    while((cx!==bx||cy!==by)&&guard++<500){
      if(cx!==bx) cx+=(bx>cx?1:-1); else if(cy!==by) cy+=(by>cy?1:-1);
      if(cy<0||cy>=ZH||cx<0||cx>=ZW) break;
      var t=g[cy][cx];
      if(t==='u'){ g[cy][cx]='='; } else if(t!=='D'&&t!=='Q'&&t!=='b') g[cy][cx]=',';
    }
  }
  for(i=0;i<Z_SITES.length;i++) dome(Z_SITES[i][0],Z_SITES[i][1]);
  var HOME=[Z_SITES[0][0]+1,Z_SITES[0][1]+3];
  for(i=1;i<Z_SITES.length;i++) road(Z_SITES[i][0]+1,Z_SITES[i][1]+3,HOME[0],HOME[1]);
  /* the landing site, bottom-left, where the Integral sets down */
  for(y=ZH-8;y<ZH-3;y++) for(x=5;x<14;x++) g[y][x]='S';
  g[ZH-4][8]='D'; g[ZH-4][9]='D';
  road(8,ZH-5,HOME[0],HOME[1]);
  function reach(sx,sy){
    var seen={},q=[[sx,sy]]; seen[sx+','+sy]=1;
    var nb=[[0,1],[0,-1],[1,0],[-1,0]];
    while(q.length){ var p=q.shift();
      for(var d=0;d<4;d++){ var nx=p[0]+nb[d][0], ny=p[1]+nb[d][1], kk=nx+','+ny;
        if(seen[kk])continue;
        if(nx<0||ny<0||nx>=ZW||ny>=ZH)continue;
        if(SOLID[g[ny][nx]])continue;
        seen[kk]=1; q.push([nx,ny]); } }
    return seen;
  }
  var doors=[[8,ZH-4]];
  for(i=0;i<Z_SITES.length;i++) doors.push([Z_SITES[i][0]+1,Z_SITES[i][1]+3]);
  for(var pass=0;pass<4;pass++){
    var seen=reach(HOME[0],HOME[1]),missing=0;
    for(i=0;i<doors.length;i++)
      if(!seen[doors[i][0]+','+doors[i][1]]){ missing++; road(doors[i][0],doors[i][1],HOME[0],HOME[1]); }
    if(!missing) break;
  }
  var rows=[]; for(y=0;y<ZH;y++) rows.push(g[y].join(''));
  return {rows:rows,sites:Z_SITES};
}

   q('UND22'),
   "He followed them here afterwards, to this street, in the wet snow, to say something crushing to somebody. Anybody.",
   "And instead he found a girl of twenty from Riga, newly arrived at the house, and he talked at her for an hour.",
   "He described to her, in detail, what her life would be and how it would end, and he did it beautifully, and he did it to hurt.",

   q('UND19'),

   "Then he took it back. He explained that he had only been amusing himself. He was thorough about it.",

   "She left. He found the money he had pressed into her hand on the table by the door, where she had put it down.",

/* ================= LINK THE TWO WORLD MAPS ================= */
(function(){
  function link(world,sites,cityLike){
    var W=MAPS[world].warps;
    for(var i=0;i<sites.length;i++){
      var c=sites[i], id=c[2];
      if(!MAPS[id]) continue;
      var dx=c[0]+(cityLike?2:1), dy=c[1]+(cityLike?3:2);
      var e=MAPS[id].entry||(cityLike?[11,16]:[8,11]);
      var tx=e[0], ty=e[1];
      W.push({x:dx,y:dy,to:id,tx:tx,ty:ty},{x:dx+1,y:dy,to:id,tx:tx+1,ty:ty});
      var back=MAPS[id].warps.filter(function(w){ return w.to===world; }), n=0;
      for(var j=0;j<back.length;j++){ back[j].tx=dx+Math.min(n,1); back[j].ty=dy+1; n++; }
    }
  }
  link('OW',OWDATA.cities,1);
  link('OW',OWDATA.huts,0);
  /* the camps hang off the same hut table, so their doors are already placed */
  link('ZELYON',ZDATA.sites,0);
  /* the landing pad, bottom-left of the green world */
  MAPS.ZELYON.warps.push({x:8,y:ZH-4,to:'INTEGRAL',tx:8,ty:11},{x:9,y:ZH-4,to:'INTEGRAL',tx:9,ty:11});
  MAPS.INTEGRAL.warps.push({x:8,y:12,to:'ZELYON',tx:8,ty:ZH-5,need:'PASSAGE',
    deny:["The gantry is locked out. Without D-503's own authority the Integral will not answer."]});
})();

function heroState(id){
  if(!G.hero[id]){ var h=HEROES[id]; G.hero[id]={id:id,lv:1,xp:0,hp:h.hp,mp:h.mp,skills:[],guard:0,
    buff:{atk:0,def:0},dead:0,form:0}; applyLearn(G.hero[id]); }
  if(G.hero[id].form===undefined) G.hero[id].form=0;
  return G.hero[id];
}
function stat(id,s){ var h=HEROES[id],st=heroState(id),lv=st.lv-1;
  var base={hp:h.hp+h.ghp*lv,mp:h.mp+h.gmp*lv,atk:h.atk+h.gatk*lv,def:h.def+h.gdef*lv,
    mag:h.mag+h.gmag*lv,spd:h.spd+h.gspd*lv};
  return Math.round(base[s]+(G.boons[s]||0));
}
function applyLearn(st){ var L=HEROES[st.id].learn;
  for(var k in L){ if(st.lv>=+k){ for(var i=0;i<L[k].length;i++) if(st.skills.indexOf(L[k][i])<0) st.skills.push(L[k][i]); } } }
function xpNeed(lv){ return Math.round(16*lv*lv+24*lv); }
function addXp(id,amt){ var st=heroState(id),msgs=[]; st.xp+=amt;
  while(st.lv<60 && st.xp>=xpNeed(st.lv)){ st.xp-=xpNeed(st.lv); st.lv++;
    var pre=st.skills.slice(); applyLearn(st);
    st.hp=stat(id,'hp'); st.mp=stat(id,'mp');
    msgs.push(HEROES[id].short+" reaches level "+st.lv+"!");
    for(var i=0;i<st.skills.length;i++) if(pre.indexOf(st.skills[i])<0) msgs.push(HEROES[id].short+" learns "+SKILLS[st.skills[i]].n+"!");
  } return msgs;
}

/* ================= INPUT (keyboard + multi-touch) ================= */
var K={up:0,down:0,left:0,right:0,a:0,b:0};

}
function tap(k){ if(TAP[k]){ TAP[k]=0; return 1; } return 0; }
function clearTaps(){ for(var k in TAP) TAP[k]=0; }
(function(){
  var KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
    w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',
    z:'a',Z:'a',Enter:'a',' ':'a',x:'b',X:'b',Escape:'b',Shift:'b'};
  window.addEventListener('keydown',function(e){ var k=KM[e.key]; if(k){ e.preventDefault(); KB[k]=1; syncKeys(); } });
  window.addEventListener('keyup',function(e){ var k=KM[e.key]; if(k){ e.preventDefault(); KB[k]=0; syncKeys(); } });
  window.addEventListener('blur',function(){ KB={}; TC={}; syncKeys(); });
})();
/* pad geometry, recomputed on resize */
var PAD={w:0,h:0,dx:0,dy:0,dr:0,ax:0,ay:0,ar:0,bx:0,by:0,br:0};
function layoutPad(){
  var r=padEl.getBoundingClientRect();
  PAD.w=r.width; PAD.h=r.height;
  var s=Math.min(PAD.w/2.2,PAD.h);
  PAD.dr=Math.max(46,Math.min(s*0.46,86));
  PAD.dx=Math.max(PAD.dr+14,PAD.w*0.24); PAD.dy=PAD.h*0.52;
  PAD.ar=Math.max(30,Math.min(PAD.h*0.24,50));

  PAD.ax=PAD.w-PAD.ar-16; PAD.ay=PAD.h*0.42;
  PAD.bx=PAD.ax-PAD.ar-PAD.br-8; PAD.by=PAD.h*0.66;
}
var touches={};
function zoneFor(x,y){

  if(ddx*ddx+ddy*ddy<=PAD.br*PAD.br*1.45) return ['b'];

  syncKeys();
}
function padPt(t){ var r=padEl.getBoundingClientRect(); return [t.clientX-r.left,t.clientY-r.top]; }
function onTS(e){ e.preventDefault();

    touches[t.identifier]=zoneFor(p[0],p[1]); }
  refreshTouch(); }

/* mouse fallback */
(function(){ var down=0;
  function pt(e){ var r=padEl.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }

/* ================= LAYOUT / HI-DPI ================= */
var DPR=1,VSCALE=1;

  var vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,3);
  var land=vw>vh*1.15;
  var padH=land?Math.max(110,vh*0.30):Math.max(140,Math.min(vh*0.36,270));
  var availH=vh-padH;

  var S=Math.max(1,Math.min(4,Math.ceil(dw*DPR/SW)));
  VSCALE=S;
  cvs.width=SW*S; cvs.height=SH*S;
  cvs.style.width=Math.round(dw)+'px'; cvs.style.height=Math.round(dh)+'px';
  stageEl.style.height=Math.round(dh)+'px';
  ctx=cvs.getContext('2d'); ctx.setTransform(S,0,0,S,0,0); ctx.imageSmoothingEnabled=false;
  layoutPad();

window.addEventListener('resize',fit);

/* ---- draw the touch pad ---- */
function drawPad(){
  var c=pctx,w=PAD.w,h=PAD.h;
  c.clearRect(0,0,w,h);
  /* d-pad */
  var R=PAD.dr, cx=PAD.dx, cy=PAD.dy;
  c.fillStyle='rgba(255,255,255,0.035)'; c.beginPath(); c.arc(cx,cy,R*1.12,0,6.3); c.fill();
  c.strokeStyle='rgba(200,190,170,0.16)'; c.lineWidth=2;
  c.beginPath(); c.arc(cx,cy,R*1.12,0,6.3); c.stroke();
  var arm=R*0.55, thick=R*0.62;
  function pad4(dx,dy,on,tri){
    c.save(); c.translate(cx+dx*arm,cy+dy*arm);
    var gw=(dx?thick*0.92:thick), gh=(dy?thick*0.92:thick);
    c.fillStyle=on?'#8f2020':'rgba(58,58,68,0.92)';
    c.beginPath();
    var rr=Math.min(gw,gh)*0.28;
    c.moveTo(-gw/2+rr,-gh/2); c.lineTo(gw/2-rr,-gh/2); c.quadraticCurveTo(gw/2,-gh/2,gw/2,-gh/2+rr);
    c.lineTo(gw/2,gh/2-rr); c.quadraticCurveTo(gw/2,gh/2,gw/2-rr,gh/2);
    c.lineTo(-gw/2+rr,gh/2); c.quadraticCurveTo(-gw/2,gh/2,-gw/2,gh/2-rr);
    c.lineTo(-gw/2,-gh/2+rr); c.quadraticCurveTo(-gw/2,-gh/2,-gw/2+rr,-gh/2); c.closePath(); c.fill();
    c.strokeStyle=on?'#e05050':'rgba(120,118,132,0.5)'; c.lineWidth=1.5; c.stroke();
    c.fillStyle=on?'#ffe0b0':'#b8b0a2'; var s=Math.min(gw,gh)*0.26;
    c.beginPath();
    c.moveTo(tri[0]*s,tri[1]*s); c.lineTo(tri[2]*s,tri[3]*s); c.lineTo(tri[4]*s,tri[5]*s);
    c.closePath(); c.fill();
    c.restore();
  }
  pad4(0,-1,K.up,[0,-1,1,0.7,-1,0.7]);
  pad4(0,1,K.down,[0,1,-1,-0.7,1,-0.7]);
  pad4(-1,0,K.left,[-1,0,0.7,-1,0.7,1]);
  pad4(1,0,K.right,[1,0,-0.7,1,-0.7,-1]);
  c.fillStyle='rgba(40,40,48,0.85)'; c.beginPath(); c.arc(cx,cy,R*0.2,0,6.3); c.fill();
  /* buttons */
  function btn(bx,by,br,on,label,hue){
    var g=c.createRadialGradient(bx-br*0.3,by-br*0.35,br*0.1,bx,by,br);
    if(on){ g.addColorStop(0,hue[2]); g.addColorStop(1,hue[3]); }
    else { g.addColorStop(0,hue[0]); g.addColorStop(1,hue[1]); }
    c.fillStyle=g; c.beginPath(); c.arc(bx,by,br,0,6.3); c.fill();
    c.strokeStyle=on?'#ffd890':'rgba(255,255,255,0.22)'; c.lineWidth=2.5;
    c.beginPath(); c.arc(bx,by,br,0,6.3); c.stroke();
    c.fillStyle=on?'#2a1800':'#f4e6c8';
    c.font='700 '+Math.round(br*0.62)+'px -apple-system,system-ui,sans-serif';
    c.textAlign='center'; c.textBaseline='middle'; c.fillText(label,bx,by+1);
  }
  btn(PAD.ax,PAD.ay,PAD.ar,K.a,'A',['#c0392b','#5c1010','#f0c040','#8a5a10']);
  btn(PAD.bx,PAD.by,PAD.br,K.b,'B',['#41567a','#12203a','#89b4e8','#2a4a7a']);
  c.fillStyle='rgba(150,144,130,0.55)';
  c.font='500 '+Math.max(9,Math.round(PAD.h*0.062))+'px -apple-system,system-ui,sans-serif';
  c.textAlign='center'; c.textBaseline='alphabetic';

var DLG={on:0,lines:[],i:0,cb:null,title:'',art:null,ch:0};

function dlgStep(){

/* ================= FIELD ================= */
var LIGHTC=null,lctx=null;
function lightBuf(){ if(!LIGHTC){ LIGHTC=document.createElement('canvas');
  LIGHTC.width=SW; LIGHTC.height=SH; lctx=LIGHTC.getContext('2d'); } return LIGHTC; }
function baseTile(m){
  if(m._base) return m._base;
  var cnt={},best='.',bn=-1,y,x;
  for(y=0;y<m.rows.length;y++){ var r=m.rows[y];
    for(x=0;x<r.length;x++){ var c=r[x]; if(SOLID[c]||c==='D')continue;
      cnt[c]=(cnt[c]||0)+1; if(cnt[c]>bn){ bn=cnt[c]; best=c; } } }
  m._base=best; return best;
}
function camera(){
  var m=curMap(), mw=m.rows[0].length*16, mh=m.rows.length*16;
  var cx=G.px*16+G.ox+8-SW/2, cy=G.py*16+G.oy+8-SH/2;
  if(mw<=SW) cx=(mw-SW)/2; else cx=Math.max(0,Math.min(mw-SW,cx));
  if(mh<=SH) cy=(mh-SH)/2; else cy=Math.max(0,Math.min(mh-SH,cy));
  return {x:Math.round(cx),y:Math.round(cy)};
}
function drawField(){
  var m=curMap(),cam=camera(),x,y;
  ctx.fillStyle='#06060a'; ctx.fillRect(0,0,SW,SH);
  var x0=Math.max(0,(cam.x/16|0)-1), y0=Math.max(0,(cam.y/16|0)-1);
  var x1=Math.min(m.rows[0].length, x0+SW/16+3), y1=Math.min(m.rows.length, y0+SH/16+3);
  var base=baseTile(m);
  /* ground + tiles */
  for(y=y0;y<y1;y++) for(x=x0;x<x1;x++){
    var t=tileAt(m,x,y), sx=x*16-cam.x, sy=y*16-cam.y;
    if(OVERLAY[t]&&TILES[base]) ctx.drawImage(TILES[base],sx,sy);
    var img=TILES[t]; if(img) ctx.drawImage(img,sx,sy);
  }
  /* contact shadows cast by solids */
  for(y=y0;y<y1;y++) for(x=x0;x<x1;x++){
    var t2=tileAt(m,x,y); if(SOLID[t2]&&!OVERLAY[t2])continue;
    var sx2=x*16-cam.x, sy2=y*16-cam.y;
    if(SOLID[tileAt(m,x,y-1)]&&!OVERLAY[tileAt(m,x,y-1)]) ctx.drawImage(EDGE.top,sx2,sy2);
    if(SOLID[tileAt(m,x-1,y)]&&!OVERLAY[tileAt(m,x-1,y)]) ctx.drawImage(EDGE.left,sx2,sy2);
    if(SOLID[tileAt(m,x+1,y)]&&!OVERLAY[tileAt(m,x+1,y)]) ctx.drawImage(EDGE.right,sx2,sy2);
    if(SOLID[tileAt(m,x,y+1)]&&!OVERLAY[tileAt(m,x,y+1)]) ctx.drawImage(EDGE.bot,sx2,sy2);
  }
  /* actors */
  var acts=[],i;
  for(i=0;i<m.npcs.length;i++){ var n=m.npcs[i]; if(n.gone)continue;
    if(n.x*16-cam.x<-24||n.x*16-cam.x>SW+24)continue;
    acts.push({x:n.x*16-cam.x, y:n.y*16-cam.y-8, spr:NPCSPR[n.art]||NPCSPR.CIV1,
      d:n.dir||0, f:(n.art==='BOOK')?0:(((G.anim>>5)+n.x)&3)===1?1:0, sy:n.y}); }
  var lead=G.party[0];
  acts.push({x:G.px*16+G.ox-cam.x, y:G.py*16+G.oy-cam.y-8, spr:NPCSPR[lead]||NPCSPR.UNDER,
    d:G.dir, f:G.moving?WALKSEQ[(G.walk>>2)&3]:0, sy:G.py});
  acts.sort(function(a,b){ return a.sy-b.sy; });
  for(i=0;i<acts.length;i++){ var a=acts[i];
    ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath();
    ctx.ellipse(a.x+8,a.y+23,5.5,2.2,0,0,6.3); ctx.fill();
    var fr=(a.spr[a.d]&&a.spr[a.d][a.f])?a.spr[a.d][a.f]:a.spr[0][0];
    ctx.drawImage(fr,Math.round(a.x),Math.round(a.y)); }

  if(m.dark){
    var lb=lightBuf();
    lctx.setTransform(1,0,0,1,0,0);
    lctx.globalCompositeOperation='source-over';
    lctx.clearRect(0,0,SW,SH);
    lctx.fillStyle='rgba(8,6,16,'+m.dark+')'; lctx.fillRect(0,0,SW,SH);
    lctx.globalCompositeOperation='destination-out';
    function lamp(lx,ly,r,st){ var g=lctx.createRadialGradient(lx,ly,0,lx,ly,r);
      g.addColorStop(0,'rgba(0,0,0,'+st+')'); g.addColorStop(0.55,'rgba(0,0,0,'+(st*0.5)+')');
      g.addColorStop(1,'rgba(0,0,0,0)');
      lctx.fillStyle=g; lctx.beginPath(); lctx.arc(lx,ly,r,0,6.3); lctx.fill(); }
    for(y=y0;y<y1;y++) for(x=x0;x<x1;x++){ var tt=tileAt(m,x,y);
      if(tt==='f'||tt==='L') lamp(x*16-cam.x+8,y*16-cam.y+8,44+Math.sin(G.anim*0.11+x)*4,0.95);
      else if(tt==='M') lamp(x*16-cam.x+8,y*16-cam.y+8,22,0.5); }
    lamp(G.px*16+G.ox-cam.x+8,G.py*16+G.oy-cam.y+8,52,0.85);
    lctx.globalCompositeOperation='source-over';
    ctx.drawImage(LIGHTC,0,0);
  }
  /* vignette */
  var vg=ctx.createRadialGradient(SW/2,SH/2,SH*0.42,SW/2,SH/2,SH*0.92);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,SW,SH);
  /* header */
  var nw=txtW(m.name,1)+18;
  panel(6,6,nw,18); drawTxt(ctx,m.name,15,11,'#e9d9ac',1);
  var gs=G.gold+' k';
  panel(SW-6-(txtW(gs,1)+20),6,txtW(gs,1)+20,18);

/* ================= SEARCHING THE SCENERY =================
   Crates, barrels, statues, wells, rubble and desks may be hiding something.
   Placement is rolled per save, so no two playthroughs stash things in the
   same spots, and a cache exists only until somebody turns it up. */
var SEARCHABLE={'e':1,'q':1,'Z':1,'y':1,'o':1,'x':1,'t':1,'k':1,'v':1,'U':1,'Q':1,'M':1,'f':1,'s':1};
var SEARCH_FLAVOUR={
 e:"a requisition crate, lid prised and nailed down again",
 q:"a barrel with the hoops gone slack",
 Z:"the plinth of a monument, hollow behind the plaque",
 y:"the well, and the ledge a hand's reach down the shaft",
 o:"a boulder, and the dry gap underneath it",
 x:"a heap of rubble somebody has already been through twice",
 t:"under the table, where the boards have shrunk apart",
 k:"a desk of locked drawers, one of which is not",
 v:"deep in a bush, out of the light",
 U:"a crack in the rock spire, at shoulder height",
 Q:"the seam where the dome meets its footing",
 M:"an access hatch nobody has opened since it was fitted",
 f:"the cold ash under the brazier",
 s:"behind the poster, where the paste never took"
};
/* torn pages: the banned library, scattered one leaf at a time */
var SCRAP_POOL=['HD1','HD2','HD3','HD4','GI1','GI2','GI3','GI4','CP1','TOL1','GOG1','GOG2',
                'RB1','AS1','FW1','SR1','FC1','VT1','FK1','KRO1','GOL2','GOL3','GOL4','RUS2',
                'REE1','WE4','UND12','UND21'];
function lcg(n){ return function(){ n=(n*1103515245+12345)&0x7fffffff; return (n>>>8)/8388608; }; }
function hashStr(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h*16777619)>>>0; } return h>>>0; }
function cachesFor(m){
  var key=(G.wseed|0)+':'+m.id;
  if(m._cKey===key) return m._caches;
  var r=lcg(hashStr(key)), spots=[],y,x,i;
  for(y=0;y<m.rows.length;y++){ var row=m.rows[y];
    for(x=0;x<row.length;x++) if(SEARCHABLE[row[x]]) spots.push([x,y]); }
  for(i=spots.length-1;i>0;i--){ var j=(r()*(i+1))|0, t=spots[i]; spots[i]=spots[j]; spots[j]=t; }
  var n=Math.min(spots.length, spots.length?1+Math.floor(spots.length/5):0);
  var list=[];
  for(i=0;i<n;i++) list.push({x:spots[i][0],y:spots[i][1],roll:r()});
  m._cKey=key; m._caches=list; return list;
}
function cacheAt(m,x,y){
  var c=cachesFor(m);
  for(var i=0;i<c.length;i++) if(c[i].x===x&&c[i].y===y) return c[i];
  return null;
}
function foundKey(m,x,y){ return m.id+':'+x+','+y; }
/* how rich the find is depends on how far along the game is */
function searchDepth(){
  var d=0,f=['lib1','lib2','lib3','lib4','launched'];
  for(var i=0;i<f.length;i++) if(G.flags[f[i]]) d++;
  return d;
}
function openCache(m,c,x,y){
  G.found[foundKey(m,x,y)]=1;
  var d=searchDepth(), roll=c.roll;
  /* a torn page, if there are any left to find */
  var left=SCRAP_POOL.filter(function(k){ return G.scraps.indexOf(k)<0; });
  if(roll<0.30 && left.length){
    var pick=left[Math.floor(((c.roll*9973)%1)*left.length)%left.length];
    G.scraps.push(pick);
    return {lines:["Folded small and pushed right to the back: a page torn out of a book.",
      q(pick),"Recovered pages are kept in the Archive."], name:"A torn page"};
  }
  if(roll<0.62){
    var gold=20+Math.round(roll*260*(1+d*0.6));
    G.gold+=gold;
    return {lines:["Somebody put something by, and then did not come back for it.",
      "Found "+gold+" kopeks."], name:"A hidden purse"};
  }
  if(roll<0.92){
    var pool=['BREAD','TINCT','SUGAR','PAPERS','PORK','THREAD','GRENADE','SAMOVAR'];
    if(d>=2) pool=pool.concat(['RATION','ZFRUIT']);
    if(d>=4) pool=pool.concat(['ZCORE','RATION']);
    var it=pool[Math.floor(((roll*7919)%1)*pool.length)%pool.length];
    var qty=1+(roll>0.8?1:0);
    addItem(it,qty);
    return {lines:["Wrapped in oilcloth and still sound.",
      "Found "+ITEMS[it].n+(qty>1?" x"+qty:"")+"."], name:"A cache"};
  }
  var big=['RATION','THREAD','GRENADE','SAMOVAR'][Math.floor(((roll*6151)%1)*4)%4];
  addItem(big,2);
  G.gold+=120+d*90;
  return {lines:["A proper stash. Whoever built this expected to need it and never did.",
    "Found "+ITEMS[big].n+" x2 and "+(120+d*90)+" kopeks."], name:"A proper stash"};
}
function searchScenery(m,x,y,t){
  var where=SEARCH_FLAVOUR[t]||"something worth a second look";
  if(G.found[foundKey(m,x,y)]) return null;
  var c=cacheAt(m,x,y);
  if(!c) return null;
  var r=openCache(m,c,x,y);
  say(["You search "+where+".", ].concat(r.lines), null, r.name);
  return 1;
}

function frontTile(){ var dx=[0,-1,1,0][G.dir], dy=[1,0,0,-1][G.dir];
  return {x:G.px+dx,y:G.py+dy}; }
function npcAt(m,x,y){ for(var i=0;i<m.npcs.length;i++){ var n=m.npcs[i];
  if(!n.gone&&n.x===x&&n.y===y)return n; } return null; }
/* the posters quote the State's own founding texts; the pasted-over scraps
   underneath quote the people who disagreed with them */
var SIGNS=[q('LEN1'),q('CM2'),q('CM3'),q('KRO1'),q('LEN2'),q('CM1')];
var SCRAPS=[q('WE2'),q('GOL1'),q('GOL3'),q('GOL4'),q('RUS2'),q('RUS1')];
function interact(){
  var m=curMap(),f=frontTile(),n=npcAt(m,f.x,f.y);
  if(!n && tileAt(m,f.x,f.y)==='B'){ var dx=[0,-1,1,0][G.dir],dy=[1,0,0,-1][G.dir];
    n=npcAt(m,f.x+dx,f.y+dy); }
  if(n){
    if(n.boss && !G.flags[n.flag]){
      if(n.need && !hasItem(n.need)){ say(TALEGATE,null,n.name,n.art); return; }
      say(n.tk,function(){ startBattle([].concat(n.boss),n); },n.name,n.art); return; }
    if(n.boss && G.flags[n.flag]){ say(["The room is empty. Somebody has taken down the portrait."]); return; }
    if(n.ev==='readNotes'||n.ev==='haymarket'){ runEvent(n.ev,n); return; }
    say(n.tk,function(){ if(n.ev) runEvent(n.ev,n); },n.name,n.art); return; }
  var t=tileAt(m,f.x,f.y);
  if(SEARCHABLE[t] && searchScenery(m,f.x,f.y,t)) return;
  if(t==='s'){
    var si=(G.px+G.py)%SIGNS.length;
    say(["A state poster, freshly pasted. This is what the ward is promised.",SIGNS[si],
      "Somebody has torn the corner back. Underneath is older paper, and on it what the people who came to see it wrote down.",
      SCRAPS[si]],null,"Notice"); }
  else if(t==='k') say(["A desk of drawers, all of them locked and all of them empty."]);
  else if(t==='t') say(["A table. Somebody has scratched a line into the wood, deep enough to last.",q('UND3')]);
  else if(t==='f') say(["A brazier. The only honest warmth in the building."]);
  else if(t==='M') say(["Machinery. It hums the same note the anthem starts on."]);
  else if(t==='y') say(["A well. You can hear water a long way down, and nothing else."]);
  else if(t==='Z') say(["A monument. The plaque gives the achievement but not the name. Beneath it, in smaller letters:",q('CM2')]);
  else if(t==='e'||t==='q') say(["Crates and barrels. Requisitioned, stamped, and forgotten."]);
}
function tryStep(){
  var dir=-1;
  if(K.down)dir=0; else if(K.left)dir=1; else if(K.right)dir=2; else if(K.up)dir=3;
  if(dir<0){ G.walk=0; return; }
  G.dir=dir;
  var dx=[0,-1,1,0][dir],dy=[1,0,0,-1][dir],m=curMap();
  if(blocked(m,G.px+dx,G.py+dy)){ G.walk++; return; }
  G.moving=1; G.mvx=dx; G.mvy=dy; G.mvp=0;
}
function stepMove(){
  if(!G.moving) return;
  G.mvp+=4; G.walk++; G.ox=G.mvx*G.mvp; G.oy=G.mvy*G.mvp;
  if(G.mvp>=16){ G.px+=G.mvx; G.py+=G.mvy; G.ox=G.oy=0; G.moving=0; G.steps++;
    onArrive(); }
}
function onArrive(){
  var m=curMap();
  for(var i=0;i<m.warps.length;i++){ var w=m.warps[i];
    if(w.x===G.px&&w.y===G.py){
      if(w.need&&!hasItem(w.need)){ say(w.deny||["The door is locked."]); return; }
      if(w.needFlag&&!G.flags[w.needFlag]){ say(w.deny||["The door is locked."]); return; }
      doWarp(w); return; } }
  if(G.encCool>0){ G.encCool--; return; }
  if(m.enc && Math.random()<m.enc.rate) rollEncounter(m);
}
function doWarp(w){
  fadeTo(function(){ G.map=w.to; G.px=w.tx; G.py=w.ty; G.ox=G.oy=0; G.encCool=10; G.moving=0; });
}
function rollEncounter(m){
  var tab=m.enc.tab,tot=0,i;
  for(i=0;i<tab.length;i++) tot+=tab[i][1];
  var pick=function(){ var r=Math.random()*tot,c=0;
    for(var j=0;j<tab.length;j++){ c+=tab[j][1]; if(r<c)return tab[j][0]; } return tab[0][0]; };
  var n=1+(Math.random()<0.55?1:0)+(Math.random()<0.22?1:0),list=[];
  for(i=0;i<n;i++) list.push(pick());
  G.encCool=14+((Math.random()*10)|0);
  fadeTo(function(){ startBattle(list,null); });
}

/* ================= EVENTS ================= */
function partyAdd(id){
  heroState(id);
  if(G.party.indexOf(id)>=0||G.bench.indexOf(id)>=0) return;
  if(G.party.length<4) G.party.push(id); else G.bench.push(id);
}
function grantBoon(key){
  var it=ITEMS[key]; if(!it||it.k!=='boon')return;
  if(hasItem(key))return;
  addItem(key); G.boons[it.st]=(G.boons[it.st]||0)+it.p;
  for(var i=0;i<G.party.length;i++){ var st=heroState(G.party[i]);
    st.hp=Math.min(stat(G.party[i],'hp'),st.hp+(it.st==='hp'?it.p:0)); }
}
function teach(sk){
  var id=G.party[0]||'UNDER', st=heroState(id);
  if(st.skills.indexOf(sk)<0){ st.skills.push(sk);
    return HEROES[id].short+" learns "+SKILLS[sk].n+"."; }
  return '';
}
function runEvent(ev,npc){
  var p=ev.split(':');
  if(p[0]==='joinLiza'){ partyAdd('LIZA'); npc.gone=1; G.flags.lizaJoined=1;
    say(["Liza joins the party.","You climb the cellar stairs for the first time in eleven years. The light is an insult."]); }
  else if(p[0]==='readNotes'){
    var first=!hasItem('NOTES');
    if(first) addItem('NOTES');
    var i=G.flags.upage|0;
    if(i>=UNDERGROUND.length){
      say(["You have read it all the way through. It does not improve, and it does not stop being yours.",
        "(Every passage is kept under Notebook in the menu.)"],null,"The Notebook",'BOOK');
      return; }
    G.flags.upage=i+1;
    var pre=first?["A notebook, open, in your own hand. You start at the beginning."]
                 :["You turn the page. Passage "+(i+1)+" of "+UNDERGROUND.length+"."];
    say(pre.concat([q(UNDERGROUND[i])]),null,"The Notebook",'BOOK'); }
  else if(p[0]==='haymarket'){
    G.flags.haymarket=1;
    say(npc.tk,null,"A Room off the Haymarket",'LIZA'); }
  else if(p[0]==='joinI330'){ partyAdd('I330'); npc.gone=1;
    say(["I-330 joins the party.","I-330: The widow in the tenement still has her husband's Ministry key. Ask her gently."]); }
  else if(p[0]==='joinD503'){ partyAdd('D503'); npc.gone=1; say(["D-503 joins the party."]); }
  else if(p[0]==='give'){ if(!hasItem(p[1])){ addItem(p[1]);
    npc.tk=["Go on, then. Do not make me regret it."];
    var extra=(p[1]==='TALES')?["Eight cottages are marked in the endpapers. None of them are on any ward map."]:[];
    say(["Obtained: "+ITEMS[p[1]].n+"."].concat(extra)); } }
  else if(p[0]==='recruit'){
    var who={C1:'YEFIM',C2:'MARFA',C3:'OSIP',C4:'GRISHA'}[p[1]];
    if(who){ partyAdd(who); npc.gone=1;
      say([HEROES[who].short+" joins the party.",HEROES[who].bio],null,HEROES[who].n,who); } }
  else if(p[0]==='launch'){
    if(!hasItem('PASSAGE')){ say(["D-503: Not yet. The gantry answers to an authority I have not been given back."]); return; }
    G.flags.launched=1;
    cut('greenworld',[
      "The Integral goes up off the boulevard without asking the city's permission, which is the first honest thing it has ever done.",
      "Somewhere past the third planet the windows stop showing anything you have a word for.",
      "Then: green. A whole world of it, the colour of the grass I-330 had in her teeth, and a sun the wrong shade behind it.",
      "The gantry sets you down in a field of it. Nobody shoots at you. That is new."],
      function(){ fadeTo(function(){ G.map='ZELYON'; G.px=8; G.py=ZH-5; G.ox=G.oy=0; G.moving=0; G.encCool=14; }); }); }
  else if(p[0]==='teachAscend'){
    npc.tk=["Hold it as long as you mean it, and no longer."];
    var m=teach('ASCEND');
    G.flags.ascend=1;
    say(["Elder Vosk sets two fingers against your sternum and does not explain anything.",
      m||"The party already knows how.",
      "In battle, Ascend turns the hair pale blue and lifts attack, magic and speed for the rest of the fight.",
      "It burns MP every round, and it lapses the moment the MP runs out."]); }
  else if(p[0]==='joinNael'){ partyAdd('NAEL'); npc.gone=1;
    say(["Nael joins the party.",HEROES.NAEL.bio],null,HEROES.NAEL.n,'NAEL'); }
  else if(p[0]==='shopz'){ openShop(1); }
  else if(p[0]==='hire'){ openHire(p[1],npc); }
  else if(p[0]==='shop'){ openShop(); }
}

    if(tap('a')){ var c=MAIN_ITEMS[MENU.sel];

      MENU.msg=''; MENU.page=c.toLowerCase(); MENU.sub=0; MENU.sel=0; }

  if(p==='items'){ var l=invList();
    if(!MENU.sub){ listNav(Math.max(1,l.length));
      if(tap('b')){ MENU.page='main'; MENU.sel=0; MENU.msg=''; return; }

    else { var np=G.party.length;
      if(tap('up')) MENU.tgt=(MENU.tgt+np-1)%np;

        if(MENU.sel>=invList().length) MENU.sel=Math.max(0,invList().length-1); } }
    return; }
  if(p==='party'||p==='skills'||p==='journal'){ if(tap('b')||tap('a')){ MENU.page='main'; MENU.sel=0; } return; }
  if(p==='archive'){ var n2=Math.max(1,G.scraps.length);

function useItem(k,tid,inBattle){
  var it=ITEMS[k]; if(!it) return '';
  var st=heroState(tid),mx=stat(tid,'hp'),mm=stat(tid,'mp'),nm=HEROES[tid].short;
  if(it.k==='hp'){ if(st.dead)return nm+" cannot eat."; st.hp=Math.min(mx,st.hp+it.p); delItem(k); return nm+" recovers "+it.p+" HP."; }
  if(it.k==='hpfull'){ if(st.dead)return nm+" cannot eat."; st.hp=mx; delItem(k); return nm+" is fully restored."; }
  if(it.k==='mp'){ if(st.dead)return nm+" cannot drink."; st.mp=Math.min(mm,st.mp+it.p); delItem(k); return nm+" recovers "+it.p+" MP."; }
  if(it.k==='cure'){ st.buff.atk=0; st.buff.def=0; st.hp=Math.min(mx,st.hp+it.p); delItem(k); return nm+" clears their head."; }
  if(it.k==='revive'){ if(!st.dead) return nm+" has not fallen.";
    st.dead=0; st.hp=Math.round(mx*it.p); delItem(k); return nm+" rises."; }
  if(it.k==='escape'){ if(!inBattle) return "Nothing to escape from."; delItem(k); return '@escape'; }
  if(it.k==='bomb'){ if(!inBattle) return "Not here. Not yet."; delItem(k); return '@bomb'; }
  return it.d;
}

      var done=0; for(var ai=0;ai<AR.length;ai++) if(G.flags[AR[ai][0]]) done++;
      L.push("  The Lord's people, "+done+" of 5:");
      for(var aj=0;aj<AR.length;aj++)
        L.push((G.flags[AR[aj][0]]?"    [done] ":"    [  ]  ")+AR[aj][1]);
    }
    L.push("");
  }
  var camps=0,CL=['YEFIM','MARFA','OSIP','GRISHA'];
  for(var ci=0;ci<4;ci++) if(G.party.indexOf(CL[ci])>=0||G.bench.indexOf(CL[ci])>=0) camps++;
  L.push("Camps found  "+camps+" of 4   (armoury, farmstead, magazine, quarry)");
  L.push("");
  L.push("Pages recovered  "+G.scraps.length+" of "+SCRAP_POOL.length+"   (search crates, plinths, wells, rubble)");
  L.push("");
  L.push("Cities freed  "+freed+" of 4        Tales closed  "+tales+" of 8");
  L.push("Steps taken  "+G.steps);
  return L;
}

/* ================= BATTLE CORE ================= */
var BT=null;
function startBattle(keys,npc){
  var foes=[],i;
  for(i=0;i<keys.length;i++){ var m=MONS[keys[i]];
    foes.push({k:keys[i],n:m.n,art:m.art,hp:m.hp,max:m.hp,atk:m.atk,def:m.def,mag:m.mag,spd:m.spd,
      xp:m.xp,g:m.g,sk:m.sk||[],boss:m.boss||0,dead:0,buff:{atk:0,def:0},guard:0,healUsed:0,
      x:0,y:0,ox:0,oy:0,shake:0,flash:0,fade:0,tag:'',
      forms:m.forms?m.forms.slice():null,fi:0}); }
  var tags={},used={};
  for(i=0;i<foes.length;i++) tags[foes[i].n]=(tags[foes[i].n]||0)+1;
  for(i=0;i<foes.length;i++){ var f=foes[i];
    if(tags[f.n]>1){ used[f.n]=(used[f.n]||0)+1; f.tag=' '+String.fromCharCode(64+used[f.n]); } }
  var n=foes.length;
  for(i=0;i<n;i++){
    foes[i].x=(n===1)?52:(14+i*Math.min(58,(150/Math.max(1,n-1))));
    foes[i].y=(n===1)?38:(26+(i%2)*20);
  }
  for(i=0;i<G.party.length;i++){ var st=heroState(G.party[i]); st.guard=0; st.buff={atk:0,def:0}; st.form=0; }
  BT={foes:foes,npc:npc,phase:'intro',t:0,order:[],oi:0,sel:0,sel2:0,tsel:0,sub:0,fleeTries:0,life:0,
      log:[],msg:'',pending:null,shakeT:0,pops:[],fx:[],round:0,act:null,
      hpos:{},hshake:{},hflash:{},winLines:null,wi:0,flash:0};
  layoutHeroes();
  BT.msg = foes.length>1 ? (foes[0].n+" and others block the way!") : (foes[0].n+" blocks the way!");
  G.mode='battle'; clearTaps();
}
function layoutHeroes(){
  for(var i=0;i<G.party.length;i++){
    BT.hpos[G.party[i]]={x:206+(i%2)*40, y:52+i*22, ox:0, oy:0};
    if(BT.hshake[G.party[i]]===undefined) BT.hshake[G.party[i]]=0;
    if(BT.hflash[G.party[i]]===undefined) BT.hflash[G.party[i]]=0;
  }
}
/* Which skills need the player to pick something. This table is the only
   authority: the battle menu and useSkill both read it, so a new skill kind
   can never again be castable with a null target. */
var FOE_TGT={dmg:1,pierce:1,debuff:1,steal:1,multi:1,drain:1};
var ALLY_TGT={heal:1,revive:1};
function needsFoe(k){ return !!FOE_TGT[k]; }
function needsAlly(k){ return !!ALLY_TGT[k]; }
var FORM_SKILLS=['BLAST','WOLFBOLT'];
/* form 1 = ascended (pale blue, fast). form 2 = the green rage (huge, brutal). */
var FORM_MP=[0,3,6];
var FORM2_SKILLS=['RAGEBLAST','WOLFBOLT'];
function formMul(id,which){
  var f=heroState(id).form;
  if(!f) return 1;
  if(f===2) return which==='spd'?1.12:(which==='def'?1.3:2.05);
  return which==='spd'?1.4:(which==='def'?1.15:1.62);
}
/* while ascended a hero can throw light, whether or not they ever learned how */
function skillList(id){
  var st=heroState(id), l=st.skills.slice();
  var add=st.form===2?FORM2_SKILLS:(st.form?FORM_SKILLS:null);
  if(add) for(var i=0;i<add.length;i++) if(l.indexOf(add[i])<0) l.push(add[i]);
  return l;
}
function livingFoes(){ return BT.foes.filter(function(f){return !f.dead;}); }
function livingHeroes(){ return G.party.filter(function(id){ return !heroState(id).dead; }); }
function pop(x,y,txt,col,big){ BT.pops.push({x:x,y:y,t:0,s:txt,c:col||'#ffffff',b:big?2:1}); }
function addFx(kind,c1,c2,x,y,r,dur){ BT.fx.push({k:kind,c1:c1,c2:c2,x:x,y:y,r:r||30,t:0,dur:dur||36}); }
function foeCx(f){ return f.x+32; }
function foeCy(f){ return f.y+32; }
function heroCx(id){ var p=BT.hpos[id]; return p?p.x+16:250; }
function heroCy(id){ var p=BT.hpos[id]; return p?p.y+24:90; }

var ROUND_WEAR=18, ROUND_CAP=40;
function newRound(){
  BT.round++;
  /* No fight may run forever. From round 18 the enemy wears down, harder each
     round, and round 40 is an absolute stop. */
  if(BT.round>ROUND_WEAR){ var lf0=livingFoes();
    var wear=Math.min(0.22,0.035+0.015*(BT.round-ROUND_WEAR));
    for(var q=0;q<lf0.length;q++){ var ff=lf0[q];
      ff.hp-=Math.max(8,Math.round(ff.max*wear));
      if(ff.hp<=0){ ff.hp=0; ff.dead=1; ff.fade=1; } }
    if(BT.round===ROUND_WEAR+1) BT.msg="They are tiring."; }
  if(BT.round>=ROUND_CAP){ forceEndBattle(); return; }
  var o=[],i;
  for(i=0;i<G.party.length;i++){ var id=G.party[i],st=heroState(id); st.guard=0;
    if(st.form && !st.dead){ st.mp-=FORM_MP[st.form]||3;
      if(st.mp<=0){ st.mp=0; st.form=0; BT.msg=HEROES[id].short+" cannot hold the form."; } }
    if(!st.dead) o.push({side:'h',id:id,spd:stat(id,'spd')*formMul(id,'spd')+Math.random()*4}); }
  for(i=0;i<BT.foes.length;i++){ var f=BT.foes[i]; f.guard=0;
    if(!f.dead) o.push({side:'e',f:f,spd:f.spd+Math.random()*4}); }
  o.sort(function(a,b){ return b.spd-a.spd; });
  BT.order=o; BT.oi=0; nextTurn();
}
function nextTurn(){
  if(!livingFoes().length){ winBattle(); return; }
  if(!livingHeroes().length){ BT.phase='lose'; BT.t=0; BT.msg="The party falls."; return; }
  while(BT.oi<BT.order.length){
    var e=BT.order[BT.oi];
    if(e.side==='h'){ if(heroState(e.id).dead){ BT.oi++; continue; }
      BT.phase='cmd'; BT.sub=0; BT.sel=0; BT.sel2=0; BT.actor=e.id; BT.msg=''; clearTaps(); return; }
    else { if(e.f.dead){ BT.oi++; continue; } foeAct(e.f); return; }
  }
  newRound();
}
function advance(){ BT.msg2=''; BT.oi++; nextTurn(); }
/* buffs and debuffs are clamped: without this, a foe that spams a debuff every
   round can drive the party's attack below the damage floor and stall forever */
function bclamp(v){ return Math.max(-0.55,Math.min(1.2,v)); }
function physDmg(a,d,p,pierce){ var base=a*2.6*p-(pierce?0:d*1.4);
  return Math.max(1,Math.round(base*(0.9+Math.random()*0.2))); }
function magDmg(a,d,p){ return Math.max(1,Math.round((a*2.8*p-d*0.7)*(0.9+Math.random()*0.2))); }
function hAtk(id){ var st=heroState(id); return stat(id,'atk')*(1+st.buff.atk)*formMul(id); }
function hDef(id){ var st=heroState(id); return stat(id,'def')*(1+st.buff.def)*(st.guard?2:1)*formMul(id,'def'); }
function hMag(id){ var st=heroState(id); return stat(id,'mag')*(1+st.buff.atk*0.5)*formMul(id); }
function fAtk(f){ return f.atk*(1+f.buff.atk); }
function fDef(f){ return f.def*(1+f.buff.def)*(f.guard?2:1); }
/* Some enemies do not simply die. As their health falls they shed a form and
   come back bigger, with different art, harder numbers and a new move list. */
function checkForms(f){
  if(!f.forms) return;
  while(f.fi<f.forms.length && f.hp>0 && f.hp<=f.max*f.forms[f.fi].at){
    var nf=f.forms[f.fi++];
    f.n=nf.n||f.n; if(nf.art) f.art=nf.art;
    f.atk=Math.round(f.atk*(nf.atk||1)); f.def=Math.round(f.def*(nf.def||1));
    f.mag=Math.round(f.mag*(nf.mag||1)); f.spd=Math.round(f.spd*(nf.spd||1));
    if(nf.max){ f.max=Math.round(f.max*nf.max); }
    if(nf.heal) f.hp=Math.min(f.max,f.hp+Math.round(f.max*nf.heal));
    if(nf.sk) f.sk=nf.sk.slice();
    f.healUsed=0; f.buff={atk:0,def:0};
    addFx(nf.fx||'rage', nf.c1||'#ff9a5a', nf.c2||'#ffffff', foeCx(f), foeCy(f), 54, 50);
    BT.flash=12; BT.shakeT=14;
    BT.msg2=nf.msg||(f.n+" changes shape.");
  }
}
function hurtFoe(f,d,crit){ f.hp-=d; f.flash=12; f.shake=12;
  pop(foeCx(f),f.y+16,''+d,crit?'#ffd060':'#ffd8d8',crit);
  if(f.hp<=0){ f.hp=0; f.dead=1; f.fade=1; }
  else checkForms(f); }
function hurtHero(id,d){ var st=heroState(id); st.hp-=d; BT.shakeT=8;
  BT.hshake[id]=12; BT.hflash[id]=12;
  pop(heroCx(id),heroCy(id)-14,''+d,'#ff9a9a');
  if(st.hp<=0){ st.hp=0; st.dead=1; } }
function healHero(id,v){ var st=heroState(id); if(st.dead)return;
  st.hp=Math.min(stat(id,'hp'),st.hp+v); pop(heroCx(id),heroCy(id)-14,'+'+v,'#9aff9a'); }

/* ---- spawn the visual for a skill ---- */
function spawnFx(sk,srcSide,tgt){
  var S=SKILLS[sk]; if(!S||!S.fx)return;
  var kind=S.fx[0],c1=S.fx[1],c2=S.fx[2];
  var wide=(S.k==='aoe'||S.k==='healall'||S.k==='buff'||S.k==='debuffall'||S.k==='guardall');
  if(wide){
    if(S.k==='aoe'&&srcSide==='h') addFx(kind,c1,c2,86,54,90,44);
    else if(S.k==='aoe') addFx(kind,c1,c2,246,74,74,44);
    else addFx(kind,c1,c2,246,74,74,44);
  } else if(tgt){
    if(srcSide==='h'&&typeof tgt==='object') addFx(kind,c1,c2,foeCx(tgt),foeCy(tgt),34,36);
    else if(typeof tgt==='string') addFx(kind,c1,c2,heroCx(tgt),heroCy(tgt)-8,28,36);
    else addFx(kind,c1,c2,heroCx(tgt),heroCy(tgt)-8,28,36);
  }
}
function useSkill(sk,src,isHero,targ){
  var S=SKILLS[sk],i,fs;
  var pw=S.p, nm=isHero?HEROES[src].short:src.n+src.tag;
  /* never let a targeted skill run without one */
  if(!targ && needsFoe(S.k)) targ=isHero?livingFoes()[0]:livingHeroes()[0];
  if(!targ && needsAlly(S.k)) targ=isHero?livingHeroes()[0]:livingFoes()[0];
  if(!targ && needsFoe(S.k)) { BT.msg="There is nothing left to aim at."; return; }
  if(isHero){ var st=heroState(src); st.mp-=S.mp; if(st.mp<0)st.mp=0; }
  BT.msg=nm+" uses "+S.n+"!";
  spawnFx(sk,isHero?'h':'e',targ);
  if(S.k==='dmg'){ if(isHero) hurtFoe(targ,magDmg(hMag(src),fDef(targ),pw));
    else hurtHero(targ,magDmg(src.mag,hDef(targ),pw)); }
  else if(S.k==='pierce'){ if(isHero) hurtFoe(targ,physDmg(hAtk(src),0,pw,1));
    else hurtHero(targ,physDmg(fAtk(src),0,pw,1)); }
  else if(S.k==='aoe'){ if(isHero){ fs=livingFoes(); for(i=0;i<fs.length;i++) hurtFoe(fs[i],magDmg(hMag(src),fDef(fs[i]),pw*0.85)); }
    else { var hs=livingHeroes(); for(i=0;i<hs.length;i++) hurtHero(hs[i],magDmg(src.mag,hDef(hs[i]),pw*0.8)); } }
  else if(S.k==='heal'){ healHero(targ,Math.round(pw+hMag(src)*1.4)); }
  else if(S.k==='heals'){ healHero(src,Math.round(pw+hMag(src)*1.0)); }
  else if(S.k==='healall'){ var hs2=livingHeroes(); for(i=0;i<hs2.length;i++) healHero(hs2[i],Math.round(pw+hMag(src)*1.1)); }
  else if(S.k==='selfheal'){ src.hp=Math.min(src.max,src.hp+pw); pop(foeCx(src),src.y+16,'+'+pw,'#9aff9a'); }
  else if(S.k==='revive'){ var st2=heroState(targ); if(st2.dead){ st2.dead=0; st2.hp=Math.round(stat(targ,'hp')*pw);
      BT.msg=HEROES[targ].short+" is raised."; } else BT.msg=HEROES[targ].short+" has not fallen."; }
  else if(S.k==='buff'){ var hs3=livingHeroes();
    for(i=0;i<hs3.length;i++){ var b3=heroState(hs3[i]).buff; b3[S.st]=bclamp(b3[S.st]+pw); }
    BT.msg=nm+" raises the party's "+(S.st==='atk'?'resolve':'guard')+"!"; }
  else if(S.k==='guardall'){ var hs4=livingHeroes(); for(i=0;i<hs4.length;i++) heroState(hs4[i]).guard=1;
    BT.msg=nm+" hardens the line!"; }
  else if(S.k==='debuff'){ if(isHero){ targ.buff[S.st]=bclamp(targ.buff[S.st]-pw); BT.msg=targ.n+targ.tag+"'s "+S.st+" falls!"; }
    else { var bd=heroState(targ).buff; bd[S.st]=bclamp(bd[S.st]-pw); BT.msg=HEROES[targ].short+"'s "+S.st+" falls!"; } }
  else if(S.k==='debuffall'){ if(isHero){ fs=livingFoes();
      for(i=0;i<fs.length;i++) fs[i].buff[S.st]=bclamp(fs[i].buff[S.st]-pw); }
    else { var hs5=livingHeroes();
      for(i=0;i<hs5.length;i++){ var b5=heroState(hs5[i]).buff; b5[S.st]=bclamp(b5[S.st]-pw); } }
    BT.msg=nm+" saps the opposition!"; }
  else if(S.k==='ascend'){ var sa=heroState(src);
    if(sa.form){ BT.msg=nm+" is already transformed."; }
    else { sa.form=1; BT.msg=nm+"'s hair turns pale blue. The air starts to move."; } }
  else if(S.k==='rage'){ var sr=heroState(src);
    if(sr.form===2){ BT.msg=nm+" is already past holding it in."; }
    else { sr.form=2;
      var heal=Math.round(stat(src,'hp')*0.4);
      sr.hp=Math.min(stat(src,'hp'),sr.hp+heal);
      pop(heroCx(src),heroCy(src)-14,'+'+heal,'#9aff9a');
      BT.msg=nm+" stops holding it in. She comes up green, and bigger."; } }
  else if(S.k==='drain'){
    if(isHero){ var dd=magDmg(hMag(src),fDef(targ),pw); hurtFoe(targ,dd);
      healHero(src,Math.round(dd*0.5)); BT.msg=nm+" draws the life out of "+targ.n+targ.tag+"!"; }
    else { var de=magDmg(src.mag,hDef(targ),pw); hurtHero(targ,de);
      src.hp=Math.min(src.max,src.hp+Math.round(de*0.5));
      pop(foeCx(src),src.y+16,'+'+Math.round(de*0.5),'#9aff9a'); } }
  else if(S.k==='multi'){
    var hits=3;
    if(isHero){ for(i=0;i<hits;i++) if(!targ.dead) hurtFoe(targ,physDmg(hAtk(src),fDef(targ),pw));
      BT.msg=nm+" fires three times!"; }
    else { for(i=0;i<hits;i++) hurtHero(targ,physDmg(fAtk(src),hDef(targ),pw)); } }
  else if(S.k==='steal'){ if(isHero){ hurtFoe(targ,physDmg(hAtk(src),fDef(targ),pw));
      var got=8+((Math.random()*targ.g*0.5)|0); G.gold+=got; BT.msg=nm+" lifts "+got+" kopeks!"; }
    else { hurtHero(targ,physDmg(fAtk(src),hDef(targ),pw));
      var lost=Math.min(G.gold,10+((Math.random()*40)|0)); G.gold-=lost;
      BT.msg=nm+" takes "+lost+" kopeks!"; } }
}
/* ---- action driver: lunge, hit frame, recovery ---- */
function beginAct(o){ BT.act=o; BT.act.t=0; BT.act.done=0; BT.phase='anim'; }
function stepAct(){
  var a=BT.act; a.t++;
  var p=a.t/a.dur;
  /* lunge */
  var lunge=(a.style==='melee')?Math.sin(Math.min(1,a.t/a.hit)*Math.PI)*(a.side==='h'?-30:30):
            (a.style==='cast')?Math.sin(Math.min(1,a.t/a.hit)*Math.PI)*(a.side==='h'?-6:6):0;
  var bobY=(a.style==='cast')?-Math.sin(Math.min(1,a.t/a.hit)*Math.PI)*5:0;
  if(a.side==='h'){ var hp2=BT.hpos[a.src]; if(hp2){ hp2.ox=lunge; hp2.oy=bobY; } }
  else { a.src.ox=lunge; a.src.oy=bobY; }
  if(!a.done && a.t>=a.hit){ a.done=1; a.resolve(); }
  if(a.t>=a.dur){
    if(a.side==='h'){ var hp3=BT.hpos[a.src]; if(hp3){ hp3.ox=0; hp3.oy=0; } }
    else { a.src.ox=0; a.src.oy=0; }
    BT.act=null; BT.phase='msg'; BT.t=0;
  }
}
function foeAct(f){
  var hs=livingHeroes();
  if(!hs.length){ advance(); return; }
  var tgt;
  if(f.boss && Math.random()<0.65){
    /* bosses finish what they start: pick whoever is closest to falling */
    tgt=hs[0];
    for(var q=1;q<hs.length;q++)
      if(heroState(hs[q]).hp/stat(hs[q],'hp') < heroState(tgt).hp/stat(tgt,'hp')) tgt=hs[q];
  } else tgt=hs[(Math.random()*hs.length)|0];
  var pool=f.sk.slice();
  if(f.hp>f.max*0.5 || (f.healUsed|0)>=3 || BT.round>ROUND_WEAR)
    pool=pool.filter(function(s){ return SKILLS[s].k!=='selfheal'; });
  if(pool.length && Math.random()<(f.boss?0.7:0.3)){
    var sk=pool[(Math.random()*pool.length)|0];
    var self=(SKILLS[sk].k==='selfheal');
    if(self) f.healUsed=(f.healUsed|0)+1;
    beginAct({side:'e',src:f,style:'cast',hit:17,dur:42,resolve:function(){ useSkill(sk,f,0,self?f:tgt); }});
  } else {
    beginAct({side:'e',src:f,style:'melee',hit:13,dur:36,resolve:function(){
      var d=physDmg(fAtk(f),hDef(tgt),1.0); hurtHero(tgt,d);
      addFx('slash','#ffffff','#e08080',heroCx(tgt),heroCy(tgt)-8,26,26);
      BT.msg=f.n+f.tag+" strikes "+HEROES[tgt].short+"!"; }});
  }
}
function winBattle(){
  var xp=0,gold=0,i;
  for(i=0;i<BT.foes.length;i++){ xp+=BT.foes[i].xp; gold+=BT.foes[i].g; }
  G.gold+=gold;
  var lines=["Victory.","The party gains "+xp+" experience and "+gold+" kopeks."];
  for(i=0;i<G.party.length;i++){ var st=heroState(G.party[i]);
    lines=lines.concat(addXp(G.party[i],st.dead?Math.round(xp*0.4):xp)); }
  BT.phase='win'; BT.winLines=lines; BT.wi=0; BT.t=0;
}
/* last resort: the fight has gone on far too long, break it off cleanly */
function forceEndBattle(){
  var boss=BT.foes.some(function(f){ return f.boss; });
  BT.msg=boss?"Neither of you can finish this today. You back out of the room."
             :"The fight breaks up. Everyone has had enough.";
  if(boss) BT.npc=null;
  BT.phase='flee'; BT.t=0;
}
function endBattle(){
  var npc=BT.npc; BT=null; G.mode='field'; G.encCool=22+((Math.random()*10)|0); clearTaps();
  if(npc&&npc.flag){ afterBoss(npc); }
}
function loseBattle(){ BT=null; G.mode='gameover'; G.goT=0; }

/* ================= BATTLE FX ================= */
function fxRand(f,i){ return ((Math.sin(f.x*12.9898+i*78.233)*43758.5453)%1+1)%1; }
function drawFx(f){
  var p=f.t/f.dur, e=1-Math.pow(1-p,2), a=1-p, i,ang,r;
  ctx.save(); ctx.globalAlpha=Math.max(0,a);
  var k=f.k;
  if(k==='slash'){
    for(i=0;i<3;i++){ var s=(p*2.2-i*0.22); if(s<0||s>1)continue;
      ctx.strokeStyle=i===0?f.c1:f.c2; ctx.lineWidth=4-i;
      ctx.globalAlpha=(1-s)*a+0.1;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(0.5+i*0.2),-1.9+s*2.4,-1.9+s*2.4+1.5); ctx.stroke(); }
  } else if(k==='barbs'){
    for(i=0;i<9;i++){ ang=i/9*6.283; r=f.r*(1.6-e*1.35);
      ctx.fillStyle=i%2?f.c1:f.c2;

      for(i=0;i<5;i++){ ctx.globalAlpha=a*(0.7-i*0.13);
        ctx.fillRect(f.x-6+fxRand(f,i)*14,f.y-8+fxRand(f,i+3)*16,3,3); } }
  } else if(k==='chainwhip'){
    var wp=Math.min(1,p*2.1);
    ctx.globalAlpha=a;
    for(i=0;i<11;i++){ var t3=i/10, lx2=f.x+72-wp*96*t3, ly2=f.y+Math.sin(t3*3.4+wp*5)*18*(1-t3);
      ctx.fillStyle=i%2?f.c1:f.c2;
      ctx.beginPath(); ctx.ellipse(lx2,ly2,4,3,0,0,6.283); ctx.fill(); }
    if(wp>0.7){ ctx.fillStyle=f.c2;
      ctx.beginPath(); ctx.arc(f.x,f.y,9,0,6.283); ctx.fill(); }
  } else if(k==='palm'){
    ctx.globalAlpha=a;
    for(i=0;i<4;i++){ var q12=(p*1.6-i*0.16); if(q12<0||q12>1)continue;
      ctx.globalAlpha=(1-q12)*a; ctx.strokeStyle=i%2?f.c1:f.c2; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(f.x+40-q12*70,f.y,10+q12*30,-1.1,1.1); ctx.stroke(); }
  } else if(k==='beam'){
    var bw=Math.sin(Math.min(1,p*1.6)*Math.PI)*10;
    if(bw>0.4){ ctx.globalAlpha=a; ctx.fillStyle=f.c2;
      ctx.fillRect(0,f.y-bw/2,SW,bw);
      ctx.fillStyle=f.c1; ctx.fillRect(0,f.y-bw/6,SW,bw/3); }
  }
  ctx.restore();
}

/* ================= BATTLE UPDATE ================= */
var BCMD=['Fight','Skill','Item','Guard','Flee'];
function bnav(len,key){
  if(tap('up')) BT[key]=(BT[key]+len-1)%len;
  if(tap('down')) BT[key]=(BT[key]+1)%len;
  if(K.up&&G.anim%7===0) BT[key]=(BT[key]+len-1)%len;
  if(K.down&&G.anim%7===0) BT[key]=(BT[key]+1)%len;
  if(BT[key]>=len) BT[key]=0;
}
function foeIdxLiving(){ var a=[],i; for(i=0;i<BT.foes.length;i++) if(!BT.foes[i].dead)a.push(i); return a; }
function updateBattle(){
  var i;
  /* phase watchdog: any phase that should resolve on its own but has not moved
     for ten seconds gets pushed forward instead of sitting there */
  BT.life=(BT.life|0)+1;
  if(BT.phase!==BT._lp){ BT._lp=BT.phase; BT._lt=0; } else BT._lt=(BT._lt|0)+1;
  if(BT._lt>600 && BT.phase!=='cmd'){
    BT._lt=0;
    if(BT.phase==='anim'){ if(BT.act&&!BT.act.done){ BT.act.done=1; BT.act.resolve(); }
      BT.act=null; BT.phase='msg'; BT.t=0; }
    else if(BT.phase==='win'||BT.phase==='flee'){ endBattle(); return; }
    else if(BT.phase==='lose'){ loseBattle(); return; }
    else { advance(); if(!BT) return; }
  }
  if(BT.life>7200){ forceEndBattle(); }
  for(i=0;i<BT.foes.length;i++){ var f=BT.foes[i];
    if(f.flash>0)f.flash--; if(f.shake>0)f.shake--;
    if(f.fade>0&&f.fade<24)f.fade++; else if(f.fade>=24)f.fade=24; }
  for(var id in BT.hshake){ if(BT.hshake[id]>0)BT.hshake[id]--; if(BT.hflash[id]>0)BT.hflash[id]--; }
  if(BT.shakeT>0)BT.shakeT--;
  if(BT.flash>0)BT.flash--;
  for(i=BT.pops.length-1;i>=0;i--){ BT.pops[i].t++; if(BT.pops[i].t>36)BT.pops.splice(i,1); }
  for(i=BT.fx.length-1;i>=0;i--){ BT.fx[i].t++; if(BT.fx[i].t>=BT.fx[i].dur)BT.fx.splice(i,1); }
  BT.t++;
  if(BT.phase==='anim'){ stepAct(); return; }
  if(BT.phase==='intro'){ if(BT.t>28||tap('a')){ newRound(); } return; }
  if(BT.phase==='msg'){ if(BT.t>24||tap('a')) advance(); return; }
  if(BT.phase==='flee'){ if(BT.t>30||tap('a')) endBattle(); return; }
  if(BT.phase==='win'){ if(tap('a')||BT.t>60){ BT.t=0; BT.wi++;
      if(BT.wi>=BT.winLines.length) endBattle(); } return; }
  if(BT.phase==='lose'){ if(BT.t>60&&(tap('a')||BT.t>170)) loseBattle(); return; }
  if(BT.phase!=='cmd') return;

  var aid=BT.actor,st=heroState(aid);
  if(!BT.sub){
    bnav(BCMD.length,'sel');
    if(tap('a')){ var c=BCMD[BT.sel];
      if(c==='Fight'){ BT.sub='tgtFoe'; BT.pending={kind:'atk'}; BT.tsel=0; }
      else if(c==='Skill'){ if(!skillList(aid).length){ BT.msg=HEROES[aid].short+" has no skills."; }
        else { BT.sub='skill'; BT.sel2=0; } }
      else if(c==='Item'){
        if(!invList().filter(function(k){return ITEMS[k].bat;}).length)
          BT.msg="Nothing in the pack you could use here.";
        else { BT.sub='item'; BT.sel2=0; } }
      else if(c==='Guard'){ st.guard=1; BT.msg=HEROES[aid].short+" braces.";
        addFx('shield','#9ab0c8','#e0eef8',heroCx(aid),heroCy(aid)-8,26,26);
        BT.phase='msg'; BT.t=0; }
      else if(c==='Flee'){ doFlee(); } }
    return; }
  if(BT.sub==='skill'){ var SL=skillList(aid); bnav(SL.length,'sel2');
    if(tap('b')){ BT.sub=0; return; }
    if(tap('a')){ var sk=SL[BT.sel2],S=SKILLS[sk];
      if(st.mp<S.mp){ BT.msg="Not enough MP."; return; }
      BT.pending={kind:'skill',sk:sk};
      if(needsAlly(S.k)){ BT.sub='tgtAlly'; BT.tsel=0; }
      else if(needsFoe(S.k)){ BT.sub='tgtFoe'; BT.tsel=0; }
      else { doAction(null); } }
    return; }
  if(BT.sub==='item'){ var l=invList().filter(function(k){return ITEMS[k].bat;});
    bnav(Math.max(1,l.length),'sel2');
    if(tap('b')){ BT.sub=0; return; }
    if(tap('a')&&l.length){ var k2=l[BT.sel2]; BT.pending={kind:'item',item:k2};
      if(ITEMS[k2].k==='escape'||ITEMS[k2].k==='bomb'){ doAction(null); }
      else { BT.sub='tgtAlly'; BT.tsel=0; } }
    return; }
  if(BT.sub==='tgtFoe'){ var idx=foeIdxLiving();
    if(!idx.length){ BT.sub=0; return; }
    if(tap('left')||tap('up')) BT.tsel=(BT.tsel+idx.length-1)%idx.length;
    if(tap('right')||tap('down')) BT.tsel=(BT.tsel+1)%idx.length;
    if(BT.tsel>=idx.length)BT.tsel=0;
    if(tap('b')){ BT.sub=(BT.pending&&BT.pending.kind==='skill')?'skill':0; return; }
    if(tap('a')){ var tf=BT.foes[idx[BT.tsel]];
      if(tf&&!tf.dead) doAction(tf); else BT.sub=0; }
    return; }
  if(BT.sub==='tgtAlly'){ var np=G.party.length;
    if(tap('up')||tap('left')) BT.tsel=(BT.tsel+np-1)%np;
    if(tap('down')||tap('right')) BT.tsel=(BT.tsel+1)%np;
    if(tap('b')){ BT.sub=(BT.pending&&BT.pending.kind==='skill')?'skill':'item'; return; }
    if(tap('a')) doAction(G.party[BT.tsel]);
    return; }
}
function doAction(targ){
  var aid=BT.actor,p=BT.pending;
  BT.sub=0;
  if(p.kind==='atk'){
    beginAct({side:'h',src:aid,style:'melee',hit:13,dur:34,resolve:function(){
      var d=physDmg(hAtk(aid),fDef(targ),1.0);
      var crit=Math.random()<0.07; if(crit)d=Math.round(d*1.8);
      hurtFoe(targ,d,crit);
      var wf=HEROES[aid].wfx;
      if(wf) addFx(wf[0],wf[1],wf[2],foeCx(targ),foeCy(targ),34,30);
      else addFx('slash','#fff4d0','#ffb060',foeCx(targ),foeCy(targ),34,26);
      if(crit){ addFx('impact','#ffe090','#ff9040',foeCx(targ),foeCy(targ),30,30); BT.flash=6; }
      BT.msg=HEROES[aid].short+(crit?" lands a critical blow on ":" strikes ")+targ.n+targ.tag+"!"; }});
    return; }
  if(p.kind==='skill'){
    var S=SKILLS[p.sk];
    var melee=(S.k==='steal'||S.k==='pierce'||p.sk==='HAMMERFALL');
    beginAct({side:'h',src:aid,style:melee?'melee':'cast',hit:melee?13:17,dur:melee?36:44,
      resolve:function(){ useSkill(p.sk,aid,1,targ); }});
    return; }
  if(p.kind==='item'){
    var k=p.item,it=ITEMS[k];
    if(it.k==='escape'){ delItem(k); BT.msg="Forged papers. You walk out as if expected.";
      BT.phase='flee'; BT.t=0; return; }
    beginAct({side:'h',src:aid,style:'cast',hit:12,dur:30,resolve:function(){
      if(it.k==='bomb'){ delItem(k); var fs=livingFoes();
        for(var i2=0;i2<fs.length;i2++) hurtFoe(fs[i2],it.p+((Math.random()*30)|0));
        addFx('impact','#ffd070','#ff7020',86,54,80,34); BT.flash=8;
        BT.msg="The pipe charge goes off!"; }
      else { var r=useItem(k,targ,1); BT.msg=r;
        addFx('bloom','#a8e8b0','#e8ffe8',heroCx(targ),heroCy(targ)-8,26,30); } }});
    return; }
}
function doFlee(){
  var boss=BT.foes.some(function(f){return f.boss;});
  if(boss){ BT.msg="There is no door behind you."; BT.phase='msg'; BT.t=0; return; }
  var ps=0,es=0,i;
  for(i=0;i<G.party.length;i++) ps+=stat(G.party[i],'spd');
  var lf=livingFoes(); for(i=0;i<lf.length;i++) es+=lf[i].spd;
  ps/=Math.max(1,G.party.length); es/=Math.max(1,lf.length);
  BT.fleeTries=(BT.fleeTries|0);
  /* every failed attempt makes the next easier; the fourth always works, so a
     player can never be trapped in a random encounter */
  if(BT.fleeTries>=3 || Math.random()<0.45+(ps-es)*0.05+BT.fleeTries*0.2){
    BT.msg="You get away."; BT.phase='flee'; BT.t=0; }
  else { BT.fleeTries++; BT.msg="They cut you off."; BT.phase='msg'; BT.t=0; }
}

/* ================= BATTLE RENDER ================= */
var BGCACHE={};
function battleBg(){
  var id=G.map, key=/MIN$/.test(id)?'min':(id==='OW'?'field':(/TALE/.test(id)?'tale':'field'));
  if(BGCACHE[key])return BGCACHE[key];
  BGCACHE[key]=mk(SW,152,function(x){
    var g=x.createLinearGradient(0,0,0,152);
    if(key==='min'){ g.addColorStop(0,'#120d16'); g.addColorStop(0.55,'#241626'); g.addColorStop(1,'#3a2028'); }
    else if(key==='tale'){ g.addColorStop(0,'#160f14'); g.addColorStop(0.5,'#2c1c20'); g.addColorStop(1,'#3e2a1e'); }
    else { g.addColorStop(0,'#141020'); g.addColorStop(0.5,'#241a26'); g.addColorStop(1,'#3a2a1c'); }
    x.fillStyle=g; x.fillRect(0,0,SW,152);
    x.fillStyle='rgba(0,0,0,0.35)'; x.fillRect(0,118,SW,34);
    x.fillStyle='rgba(255,255,255,0.03)'; x.fillRect(0,116,SW,2);
    seed(key.length*977+13);
    for(var i=0;i<70;i++){ x.fillStyle='rgba(0,0,0,0.18)';
      x.beginPath(); x.ellipse(rnd()*SW,120+rnd()*30,6+rnd()*12,2+rnd()*3,0,0,6.283); x.fill(); }
    for(var j=0;j<26;j++){ x.fillStyle='rgba(200,60,60,0.05)';
      x.fillRect(0,j*6,SW,2); }
    var vg=x.createRadialGradient(SW/2,60,40,SW/2,60,200);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.5)');
    x.fillStyle=vg; x.fillRect(0,0,SW,152);
  });
  return BGCACHE[key];
}
function drawBattle(){
  var sx=BT.shakeT>0?((Math.random()*5)|0)-2:0, i;
  ctx.fillStyle='#08060c'; ctx.fillRect(0,0,SW,SH);
  ctx.save(); ctx.translate(sx,0);
  ctx.drawImage(battleBg(),0,0);
  var idx=foeIdxLiving();
  /* enemies */
  for(i=0;i<BT.foes.length;i++){ var f=BT.foes[i];
    if(f.dead&&f.fade>=24)continue;
    var ox=(f.shake>0?((Math.random()*6)|0)-3:0)+(f.ox||0), oy=(f.oy||0);
    var al=f.dead?Math.max(0,1-f.fade/24):1;
    ctx.save(); ctx.globalAlpha=al;
    ctx.fillStyle='rgba(0,0,0,0.32)'; ctx.beginPath();
    ctx.ellipse(f.x+32+ox,f.y+62,22,6,0,0,6.283); ctx.fill();
    ctx.drawImage(ESPR[f.art],Math.round(f.x+ox),Math.round(f.y+oy));
    if(f.flash>0){ ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=al*(f.flash/18); ctx.fillStyle='#ff7070';
      ctx.fillRect(f.x+ox+4,f.y+oy+2,56,60); }
    ctx.restore();
    if(!f.dead){
      var hpw=44, hx=f.x+32-hpw/2;
      bar(hx,f.y-8,hpw,4,f.hp/f.max,f.boss?'#e0a030':'#c8342c');
      if(BT.phase==='cmd'&&BT.sub==='tgtFoe'&&idx[BT.tsel]===i&&((G.anim>>2)&1)){
        ctx.strokeStyle='#f2d178'; ctx.lineWidth=1;
        ctx.strokeRect(f.x+3.5,f.y+1.5,57,61);
        drawTxtC(ctx,'v',f.x+32,f.y-20,'#f2d178',1); } }
  }
  /* heroes on the field */
  for(i=0;i<G.party.length;i++){ var id=G.party[i],hp=BT.hpos[id],st=heroState(id);
    if(!hp)continue;
    var hsx=(BT.hshake[id]>0?((Math.random()*5)|0)-2:0)+(hp.ox||0);
    var hsy=(hp.oy||0);
    var sfx=st.form===2?'#G':(st.form?'#A':'');
    var sset=(sfx&&NPCSPR[id+sfx])?NPCSPR[id+sfx]:NPCSPR[id];
    var spr=sset[1][BT.phase==='anim'&&BT.act&&BT.act.src===id?1:0];
    /* the rage is physically bigger: scale up, keep the feet planted */
    var gw=st.form===2?44:32, gh=st.form===2?66:48;
    var gdx=(32-gw)/2, gdy=48-gh;
    if(st.form&&!st.dead){
      var gre=st.form===2;
      ctx.save(); ctx.globalCompositeOperation='lighter';
      var au=(gre?0.22:0.16)+0.08*Math.sin(G.anim*0.22+i);
      ctx.fillStyle=(gre?'rgba(120,255,160,':'rgba(130,215,255,')+au.toFixed(3)+')';
      ctx.beginPath(); ctx.ellipse(hp.x+16+hsx,hp.y+26+gdy/2,gre?26:20,gre?38:30,0,0,6.283); ctx.fill();
      for(var sp=0;sp<(gre?7:4);sp++){ var q=((G.anim*2.4+sp*17+i*9)%46)/46;
        ctx.fillStyle=(gre?'rgba(200,255,210,':'rgba(190,240,255,')+((1-q)*0.85).toFixed(2)+')';
        ctx.fillRect(hp.x+2+((sp*9+i*5)%30)+hsx, hp.y+46-q*(gre?60:44), gre?3:2, gre?6:4); }
      ctx.restore(); }
    ctx.save();
    if(st.dead) ctx.globalAlpha=0.32;
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath();
    ctx.ellipse(hp.x+16+hsx,hp.y+47,st.form===2?18:13,st.form===2?5:4,0,0,6.283); ctx.fill();
    if(st.dead){ ctx.translate(hp.x+16,hp.y+46); ctx.rotate(-1.4); ctx.translate(-16,-46); }
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(spr,0,0,16,24,Math.round(hp.x+hsx+gdx),Math.round(hp.y+hsy+gdy),gw,gh);
    if(BT.hflash[id]>0){ ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=BT.hflash[id]/20; ctx.fillStyle='#ff8080';
      ctx.fillRect(hp.x+hsx+gdx+4,hp.y+hsy+gdy+4,gw-8,gh-6); }
    ctx.restore();
    if(BT.phase==='cmd'&&BT.actor===id&&((G.anim>>3)&1))
      drawTxtC(ctx,'v',hp.x+16,hp.y-12,'#f2d178',1);
    if(BT.phase==='cmd'&&BT.sub==='tgtAlly'&&G.party[BT.tsel]===id&&((G.anim>>2)&1)){
      ctx.strokeStyle='#7ce89a'; ctx.lineWidth=1; ctx.strokeRect(hp.x-0.5,hp.y-0.5,33,49); }
  }
  /* fx + pops */
  for(i=0;i<BT.fx.length;i++) drawFx(BT.fx[i]);
  for(i=0;i<BT.pops.length;i++){ var p2=BT.pops[i];
    ctx.save(); ctx.globalAlpha=Math.max(0,1-Math.max(0,p2.t-24)/12);
    drawTxtC(ctx,p2.s,p2.x,p2.y-p2.t*0.8,p2.c,p2.b); ctx.restore(); }
  ctx.restore();
  if(BT.flash>0){ ctx.fillStyle='rgba(255,240,200,'+(BT.flash/22).toFixed(2)+')'; ctx.fillRect(0,0,SW,152); }

  /* message / command panel */
  panel(6,154,SW-12,40);
  if(BT.phase==='cmd'&&!BT.sub){
    drawTxt(ctx,HEROES[BT.actor].n,14,160,'#e9d9ac',1);
    for(i=0;i<BCMD.length;i++){ var xx=14+i*60;
      drawTxt(ctx,BCMD[i],xx+8,176,BT.sel===i?'#f2d178':'#b8ac98',1);
      if(BT.sel===i) cursor(xx,176); } }
  else if(BT.phase==='cmd'&&BT.sub==='skill'){
    var stA=heroState(BT.actor),SLd=skillList(BT.actor),sk2=SLd[BT.sel2],S2=SKILLS[sk2];
    drawTxt(ctx,S2.n,14,160,stA.mp>=S2.mp?'#f2d178':'#c07070',1);
    drawTxt(ctx,S2.mp+' mp   (you have '+stA.mp+')',txtW(S2.n,1)+24,160,'#7f9ac0',1);
    drawTxt(ctx,wrap(S2.d,SW-40,1)[0]||'',14,176,'#cfc4b0',1);
    drawTxt(ctx,(BT.sel2+1)+'/'+SLd.length,SW-42,160,'#8a8078',1); }
  else if(BT.phase==='cmd'&&BT.sub==='item'){
    var l2=invList().filter(function(k){return ITEMS[k].bat;});
    if(!l2.length) drawTxt(ctx,'No usable items.',14,168,'#c07070',1);
    else { var k3=l2[BT.sel2];
      drawTxt(ctx,ITEMS[k3].n+'   x'+G.inv[k3],14,160,'#f2d178',1);
      drawTxt(ctx,wrap(ITEMS[k3].d,SW-40,1)[0],14,176,'#cfc4b0',1);
      drawTxt(ctx,(BT.sel2+1)+'/'+l2.length,SW-42,160,'#8a8078',1); } }
  else if(BT.phase==='cmd'&&BT.sub==='tgtFoe'){ drawTxt(ctx,'Select a target.',14,168,'#e9d9ac',1); }
  else if(BT.phase==='cmd'&&BT.sub==='tgtAlly'){ drawTxt(ctx,'On whom?',14,168,'#e9d9ac',1); }
  else if(BT.phase==='win'){ var wl=wrap(BT.winLines[Math.min(BT.wi,BT.winLines.length-1)],SW-34,1);
    for(i=0;i<wl.length&&i<2;i++) drawTxt(ctx,wl[i],14,160+i*13,'#f2d178',1); }
  else { var ml=wrap(BT.msg||'',SW-34,1);
    for(i=0;i<ml.length&&i<(BT.msg2?1:2);i++) drawTxt(ctx,ml[i],14,160+i*13,'#f2e9d6',1);
    if(BT.msg2) drawTxt(ctx,wrap(BT.msg2,SW-34,1)[0],14,173,'#ffb45a',1); }

  var rlab=(BT.round>ROUND_WEAR)?('Round '+BT.round+'/'+ROUND_CAP):('Round '+BT.round);
  drawTxt(ctx,rlab,SW-14-txtW(rlab,1),184,BT.round>ROUND_WEAR?'#d08a5a':'#6f675c',1);
  /* party status */
  for(i=0;i<G.party.length;i++){ var id2=G.party[i],s2=heroState(id2),bx=6+i*Math.floor((SW-12)/4);
    var bw2=Math.floor((SW-12)/4)-4;
    var act=(BT.phase==='cmd'&&BT.actor===id2);
    panel(bx,198,bw2,38, act?'rgba(52,24,24,0.97)':null);
    drawTxt(ctx,HEROES[id2].short,bx+5,203,s2.dead?'#96666a':'#f2e9d6',1);
    bar(bx+5,214,bw2-10,6,s2.hp/stat(id2,'hp'),'#cf3a30');
    bar(bx+5,223,bw2-10,5,s2.mp/Math.max(1,stat(id2,'mp')),'#3f7fd0');
    drawTxt(ctx,s2.dead?'fallen':(s2.hp+'/'+stat(id2,'hp')),bx+5,229,'#c6b69c',1);
  }
}

/* ================= CINEMATIC CUTSCENES (320x240 painted plates) ================= */
var SCN={};
function ridge(x,y0,amp,step,w,col,seedn){
  seed(seedn); x.fillStyle=col; x.beginPath(); x.moveTo(0,SH);
  var y=y0; x.lineTo(0,y);
  for(var i=step;i<=w;i+=step){ y=y0+Math.sin(i*0.07+seedn)*amp*0.5+(rnd()-0.5)*amp; x.lineTo(i,y); }
  x.lineTo(w,SH); x.closePath(); x.fill();
}
function foliage(x,cx,cy,rw,rh,cols,n,seedn){
  seed(seedn);
  for(var i=0;i<n;i++){ var a=rnd()*6.283,r=Math.sqrt(rnd());

function cut(sc,lines,cb){ CUT.on=1; CUT.scene=SCENEFN[sc]?sc:'crater'; CUT.lines=lines.slice();
  CUT.i=0; CUT.cb=cb||null; CUT.t=0; CUT.ch=0; G.mode='cut'; clearTaps(); }
function updateCut(){
  CUT.t++;
  var full=qText(CUT.lines[CUT.i]).length;
  if(CUT.ch<full){ CUT.ch+=2; if(CUT.t>8&&(tap('a')||tap('b'))) CUT.ch=full; return; }
  if(CUT.t>8&&(tap('a')||tap('b'))){ CUT.i++; CUT.t=0; CUT.ch=0;
    if(CUT.i>=CUT.lines.length){ CUT.on=0; var cb=CUT.cb; CUT.cb=null; G.mode='field'; if(cb)cb(); } }
}

  ctx.drawImage(scene(CUT.scene),0,0);

}

  ctx.fillStyle='#0a0508'; ctx.fillRect(0,0,SW,SH);
  drawTxtC(ctx,'The party falls.',SW/2,64,'#a82424',2);
  var l=wrap("The Ministry files you under RESOLVED. Somewhere a clerk is relieved that the ledger balances again.",SW-56,1);
  for(var i=0;i<l.length;i++) drawTxtC(ctx,l[i],SW/2,110+i*13,'#8a8078',1);
  if(G.goT>50) drawTxtC(ctx,'press A',SW/2,SH-40,((G.anim>>3)&1)?'#f2d178':'#6a6058',1);
}
function drawEnd(){
  ctx.drawImage(scene('capital'),0,0);
  ctx.fillStyle='rgba(6,5,10,0.76)'; ctx.fillRect(0,0,SW,SH);
  var y=SH-((G.endT*0.34)|0);
  for(var i=0;i<ENDLINES.length;i++){
    var big=(ENDLINES[i]==='FABLES AND HISTORY');
    var l=wrap(ENDLINES[i],SW-44,big?2:1);
    for(var j=0;j<l.length;j++){
      if(y>-18&&y<SH+18) drawTxtC(ctx,l[j],SW/2,y,big?'#f2d178':'#cfc4b0',big?2:1);
      y+=big?22:13; }
    y+=7;
  }
  if(y<0) drawTxtC(ctx,'press A',SW/2,SH-26,((G.anim>>3)&1)?'#f2d178':'#6a6058',1);
}

/* ================= MAIN LOOP ================= */
function update(){
  G.anim++;
  stepFade();
  if(G.fadeDir!==0 && G.mode==='field'){ clearTaps(); return; }
  if(G.mode==='title'){ updateTitle(); return; }
  if(G.mode==='gameover'){ G.goT++; if(G.goT>50&&tap('a')){
      if(hasSave()&&loadGame()){ G.mode='field';
        for(var i=0;i<G.party.length;i++){ var s=heroState(G.party[i]); s.dead=0;
          if(s.hp<=0)s.hp=Math.round(stat(G.party[i],'hp')*0.4); } }
      else { G.mode='title'; TITLE.sel=0; } clearTaps(); } return; }
  if(G.mode==='end'){ G.endT++; if(G.endT>200&&tap('a')){ G.mode='title'; TITLE.sel=0; G.endT=0; clearTaps(); } return; }
  if(G.mode==='cut'){ updateCut(); return; }
  if(G.mode==='talk'){ dlgStep(); return; }
  if(G.mode==='menu'){ updateMenu(); return; }
  if(G.mode==='battle'){
    /* never sit in battle mode with no battle to run */
    if(!BT){ G.mode='field'; G.encCool=20; clearTaps(); return; }
    updateBattle(); return; }
  if(G.mode==='field'){
    if(tap('b')){ openMenu(); return; }
    if(!G.moving && tap('a')){ interact(); return; }
    if(!G.moving) tryStep();
    stepMove();
  }
}
function render(){
  ctx.imageSmoothingEnabled=false;
  if(G.mode==='title') drawTitle();
  else if(G.mode==='gameover') drawGameOver();
  else if(G.mode==='end') drawEnd();
  else if(G.mode==='cut') drawCut();
  else if(G.mode==='battle'&&BT) drawBattle();
  else if(G.mode==='menu') drawMenu();
  else { drawField(); if(G.mode==='talk') drawDlg(); }
  if(G.fade>0){ ctx.fillStyle='rgba(0,0,0,'+G.fade.toFixed(2)+')'; ctx.fillRect(0,0,SW,SH); }
}
var lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-lastT<15) return; lastT=ts;
  try{ update(); render(); drawPad(); }
  catch(e){ logErr((e&&e.message||e)+" | "+((e&&e.stack||'').split('\n')[1]||'')); }
}
requestAnimationFrame(loop);
</script>
